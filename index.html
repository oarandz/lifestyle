function trendCharts(){
  const dates = rangeDates();
  const weeks = weekBuckets(dates);
  const U = STATE.settings.units.distance;
  let html="";

  if (TREND_CAT==="workouts"){
    const completed = (d)=> STATE.workoutLogs.find(l=>l.date===d && (l.status==="Completed"||l.status==="Unscheduled"));
    // per week: workouts, runs, strength, missed, rest
    const wkVal = (test) => weeks.map(wk => {
      const days = dates.filter(d=>mondayOf(d)===wk);
      return days.filter(test).length;
    });
    const isRunDay = d => { const l=completed(d); return l && isRunNorm(norm(l.actual)); };
    const isStrDay = d => { const l=completed(d); return l && !isRunNorm(norm(l.actual)) && norm(l.actual); };
    const isMissed = d => { const l=STATE.workoutLogs.find(x=>x.date===d); return l && l.status==="Missed"; };
    const isRest   = d => { const l=STATE.workoutLogs.find(x=>x.date===d); return l && l.status==="Rest Day"; };

    html += buildChart("Workouts completed per week","Runs + strength sessions", weeks.map(shortDate),
      [{name:"Completed",color:"var(--accent)",type:"bar",values:wkVal(d=>{const l=completed(d);return !!(l&&norm(l.actual));})}], {integer:true});

    const distOf = (d,kind)=>{ const l=completed(d); if(l && norm(l.actual)===kind) return num(l.actualDistance,null); return null; };
    html += buildChart(`Running distance over time (${U})`,"All completed runs", dates.map(shortDate),
      [{name:"Distance",color:"var(--hydration)",type:"line",values:daily(dates,d=>{const l=completed(d);return (l&&isRunNorm(norm(l.actual)))?num(l.actualDistance,null):null;})}]);

    html += buildChart(`Long Run distance (${U})`,"", dates.map(shortDate),
      [{name:"Long",color:"#ff9f0a",type:"line",values:daily(dates,d=>distOf(d,"Long"))}]);
    html += buildChart(`Medium Run distance (${U})`,"", dates.map(shortDate),
      [{name:"Medium",color:"#30d158",type:"line",values:daily(dates,d=>distOf(d,"Medium"))}]);
    html += buildChart(`Short Run distance (${U})`,"", dates.map(shortDate),
      [{name:"Short",color:"#64d2ff",type:"line",values:daily(dates,d=>distOf(d,"Short"))}]);

    html += buildChart("Strength sessions per week","Legs · Upper 1 · Upper 2", weeks.map(shortDate),
      [{name:"Strength",color:"#bf5af2",type:"bar",values:wkVal(isStrDay)}], {integer:true});
    html += buildChart("Missed workouts per week","", weeks.map(shortDate),
      [{name:"Missed",color:"var(--bad)",type:"bar",values:wkVal(isMissed)}], {integer:true});
    html += buildChart("Rest days per week","", weeks.map(shortDate),
      [{name:"Rest",color:"var(--text-dim)",type:"bar",values:wkVal(isRest)}], {integer:true});
  }

  if (TREND_CAT==="hydration"){
    const sum = d=>hydrationSummary(d);
    html += buildChart("Effective hydration per day (ml)","Dashed line = daily goal", dates.map(shortDate),
      [{name:"Effective",color:"var(--hydration)",type:"line",values:daily(dates,d=>{const s=sum(d);return s.logs.length?s.effective:null;})}],
      {ref:{value:STATE.settings.hydrationGoalMl,label:"goal",color:"var(--good)"}});
    html += buildChart("Total fluid per day (ml)","", dates.map(shortDate),
      [{name:"Fluid",color:"#0a84ff",type:"bar",values:daily(dates,d=>{const s=sum(d);return s.logs.length?s.fluid:null;})}]);
    html += buildChart("Caffeine per day (mg)","", dates.map(shortDate),
      [{name:"Caffeine",color:"var(--caffeine)",type:"line",values:daily(dates,d=>{const s=sum(d);return s.logs.length?s.caffeine:null;})}]);
    html += buildChart("Sugar from drinks per day (g)","", dates.map(shortDate),
      [{name:"Sugar",color:"var(--sugar)",type:"line",values:daily(dates,d=>{const s=sum(d);return s.logs.length?s.sugar:null;})}]);
    html += buildChart("Alcohol per day (units)","", dates.map(shortDate),
      [{name:"Units",color:"var(--alcohol)",type:"bar",values:daily(dates,d=>{const s=sum(d);return s.logs.length?s.alcoholUnits:null;})}]);
    // goal completion rate
    const logged = dates.filter(d=>sum(d).logs.length);
    const met = logged.filter(d=>sum(d).met).length;
    html += `<div class="card"><div class="chart-title">Goal completion</div>
      <div class="kv"><span class="k">Days hitting goal</span><span class="v">${met} / ${logged.length||0}</span></div>
      <div class="kv"><span class="k">Completion rate</span><span class="v">${logged.length?Math.round(met/logged.length*100):0}%</span></div></div>`;
  }

  if (TREND_CAT==="nutrition"){
    const line = (key,lab,col)=> buildChart(lab, "", dates.map(shortDate),
      [{name:lab,color:col,type:"line",values:daily(dates,d=> dayHasNutrition(d) ? dayNutrient(d,key) : null)}],
      {ref: nutritionTarget(key)?{value:nutritionTarget(key),label:"target",color:"var(--good)"}:null,
       integer: key==="calories"});
    html += buildChart("Calories per day (kcal)","incl. food & drink", dates.map(shortDate),
      [{name:"Calories",color:"var(--accent)",type:"line",values:daily(dates,d=> dayHasNutrition(d) ? totalCaloriesFor(d) : null)}],
      {ref: nutritionTarget("calories")?{value:nutritionTarget("calories"),label:"target",color:"var(--good)"}:null,

  if (TREND_CAT==="body"){

      return buildChart(lab,"",dates.map(shortDate),[{name:lab,color:col,type:"line",values:vals}],{integer:dp===0});
    };
    html += line("weight","Weight (kg)","var(--accent)",1);
    html += line("bodyFat","Body fat (%)","#ff453a",1);
    html += line("muscleMass","Muscle mass (kg)","#30d158",1);
    html += line("bodyWater","Body water (%)","#0a84ff",1);

        let c=0; if(getBrushing(d,"morning")?.done)c++; if(getBrushing(d,"evening")?.done)c++; return c||null; })}], {integer:true});

      [{name:"Seconds",color:"var(--accent)",type:"line",values:daily(dates,d=>{

    // morning/evening consistency

  }

  return html || `<div class="no-data">Nothing to chart yet.</div>`;

function download(filename, text, mime="text/plain"){
  try {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  } catch(e){
    // Fallback: open data URI in a new tab
    const uri = "data:"+mime+";charset=utf-8,"+encodeURIComponent(text);
    window.open(uri, "_blank");
  }
}
function csvEscape(v){ if(v==null) return ""; v=String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function objectsToCsv(rows){
  if(!rows.length) return "";
  const set = new Set(); rows.forEach(r=>Object.keys(r).forEach(k=>set.add(k)));
  const keys=[...set];
  return keys.join(",") + "\n" + rows.map(r=>keys.map(k=>csvEscape(r[k])).join(",")).join("\n");
}
function strengthRows(){
  const out=[];
  STATE.strengthLogs.forEach(s=>{
    (s.exercises||[]).forEach(ex=>{
      (ex.sets||[]).forEach((set,i)=>{
        out.push({ date:s.date, workoutType:s.workoutType, exercise:ex.name, setNumber:i+1, kg:set.kg, reps:set.reps, done:set.done, durationSec:s.durationSec, notes:s.notes });
      });
    });
  });
  return out;
}
function flattenSettings(){
  const s=STATE.settings;
  return { hydrationGoalMl:s.hydrationGoalMl, brushingTargetSec:s.brushingTargetSec,
    ...Object.fromEntries(Object.entries(s.nutritionTargets).map(([k,v])=>["target_"+k,v])),
    target_protein: nutritionTarget("protein"),
    protein_from_weight: !!s.proteinFromWeight,
    protein_per_kg: s.proteinPerKg,
    weightUnit:s.units.weight, distanceUnit:s.units.distance, volumeUnit:s.units.volume,
    theme:s.theme, accent:s.accent, compact:s.compact, largeText:s.largeText,
    firstLongRunRun:s.firstLongRunRun, firstLongRunWalk:s.firstLongRunWalk };
}

  { key:"workouts",  lab:"Workouts",         rows:()=>STATE.workoutLogs,         json:()=>STATE.workoutLogs },

  { key:"foods",     lab:"Foods (itemised)",  rows:()=>foodRows(),                json:()=>STATE.foodLogs },
  { key:"meals",     lab:"Meals / recipes",   rows:()=>mealItemRows(),            json:()=>STATE.meals },

];
function foodRows(){ return STATE.foodLogs.map(f=>{ const o={}; Object.keys(f).forEach(k=>{ if(k!=="per100") o[k]=f[k]; }); return o; }); }
function mealItemRows(){
  const rows=[];
  STATE.meals.forEach(m=>(m.items||[]).forEach(it=>rows.push({
    meal:m.name, preparedWeightG:m.cookedWeightG!=null?m.cookedWeightG:"",
    item:it.name, amountG:it.amountG, barcode:it.barcode||"",
    calories:it.calories, protein:it.protein, carbs:it.carbs, fat:it.fat,
    satFat:it.satFat, sugar:it.sugar, fibre:it.fibre, salt:it.salt
  })));
  return rows;
}

function dataSummary(){
  const dates = new Set(allDataDates());
  const done = STATE.workoutLogs.filter(l=>l.status==="Completed"||l.status==="Unscheduled");
  const runs = done.filter(l=>isRunNorm(norm(l.actual)));
  const strength = STATE.strengthLogs.length;
  // average hydration over logged days
  const hyDays = [...new Set(STATE.hydrationLogs.map(l=>l.date))];
  const avgHy = hyDays.length ? hyDays.reduce((s,d)=>s+hydrationSummary(d).effective,0)/hyDays.length : 0;
  const nutDates = new Set();
  STATE.nutritionLogs.forEach(l=>nutDates.add(l.date));
  STATE.foodLogs.forEach(f=>nutDates.add(f.date));
  const nutArr = [...nutDates].filter(d=>totalCaloriesFor(d)>0);
  const avgCal = nutArr.length ? nutArr.reduce((s,d)=>s+totalCaloriesFor(d),0)/nutArr.length : 0;
  const lb = latestBody();
  const brushDays = [...new Set(STATE.brushingLogs.map(l=>l.date))];
  const fullBrush = brushDays.filter(d=>getBrushing(d,"morning")?.done && getBrushing(d,"evening")?.done).length;
  return {
    days: dates.size, workouts: done.length, runs: runs.length, strength,
    avgHy, avgCal, weight: lb?lb.weight:null, bodyFat: lb?lb.bodyFat:null,
    brushRate: brushDays.length ? Math.round(fullBrush/brushDays.length*100) : 0
  };
}

function selectedKeys(){ return EXPORT_CATS.filter(c=>{ const el=$("#exp_"+c.key); return el && el.checked; }); }
function stamp(){ return todayISO(); }
function exportSelected(fmtType){
  const cats = selectedKeys();
  if (!cats.length){ toast("Select at least one"); return; }
  if (fmtType==="json"){
    const out={}; cats.forEach(c=>out[c.key]=c.json());
    download(`daily-export-${stamp()}.json`, JSON.stringify(out,null,2), "application/json");
    toast("JSON exported");
  } else {
    let i=0;
    cats.forEach(c=>{
      const rows=c.rows();
      const csv=objectsToCsv(rows);
      if(!csv){ return; }
      setTimeout(()=>download(`daily-${c.key}-${stamp()}.csv`, csv, "text/csv"), i*350);
      i++;
    });
    toast(i?`Exporting ${i} CSV file${i>1?"s":""}`:"No data to export");
  }
}
function exportAllJson(){
  download(`daily-backup-${stamp()}.json`, JSON.stringify(STATE,null,2), "application/json");
  toast("Full backup exported");
}
function importJson(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      let parsed = JSON.parse(reader.result);
      // Accept either a full STATE backup or a {category:data} partial export
      if (parsed.settings || parsed.workoutLogs || parsed.drinkDatabase){
        STATE = mergeDefaults(parsed);
      } else {
        const base = defaultState();
        const map = { workouts:"workoutLogs", strength:"strengthLogs", hydration:"hydrationLogs",
          drinks:"drinkDatabase", nutrition:"nutritionLogs", body:"bodyCompositionLogs", teeth:"brushingLogs" };
        Object.entries(map).forEach(([k,sk])=>{ if(Array.isArray(parsed[k])) base[sk]=parsed[k]; });
        if (parsed.settings) base.settings=Object.assign(base.settings, parsed.settings);
        STATE = mergeDefaults(base);
      }
      save(); applySettings(); toast("Data imported"); navigate("data");
    } catch(e){
      console.error(e); toast("Import failed — invalid file");
    }
  };
  reader.readAsText(file);
  input.value="";
}
function clearAllData(){
  if (!confirm("Delete ALL data? This cannot be undone.\n\nTip: export a backup first.")) return;
  if (!confirm("Are you absolutely sure? Everything will be reset.")) return;
  STATE = defaultState();
  save(); applySettings(); toast("All data cleared"); navigate("home");
}

/* =====================================================================
   SECTION 9 — BARCODE FOOD LOGGING + MEALS  (Open Food Facts)
   ===================================================================== */
const OFF_FIELDS = "product_name,product_name_en,brands,quantity,serving_size,serving_quantity,nutriments";
const FOOD_NUTRIENTS = ["calories","protein","carbs","fat","satFat","sugar","fibre","salt"];
let PROD = null;                 // product currently being added
let ADD_TARGET = { kind:"day" }; // where a new food goes: the day, or a meal being built
let EDIT_MEAL = null;            // meal id open in the builder

/* ---- Open Food Facts lookup ---- */
async function offLookup(barcode){
  const code = String(barcode||"").trim();
  if (!/^\d{6,14}$/.test(code)) throw new Error("Enter a valid barcode (6–14 digits)");
  const url = `https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`;
  const ctl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  const tm = ctl ? setTimeout(()=>ctl.abort(), 12000) : null;
  let res;
  try { res = await fetch(url, ctl?{signal:ctl.signal}:{}); }
  finally { if (tm) clearTimeout(tm); }
  if (!res.ok) throw new Error("Lookup failed (HTTP "+res.status+")");
  const data = await res.json();
  if (!data || data.status === 0 || !data.product) return null;   // not found
  return parseOffProduct(code, data.product);
}
/* Normalise an OFF product into per-100g macros we can scale. */
function parseOffProduct(code, p){
  const n = p.nutriments || {};
  const per100 = {
    calories: pickNum(n["energy-kcal_100g"], kjToKcal(n["energy_100g"])),
    protein:  pickNum(n["proteins_100g"]),
    carbs:    pickNum(n["carbohydrates_100g"]),
    fat:      pickNum(n["fat_100g"]),
    satFat:   pickNum(n["saturated-fat_100g"]),
    sugar:    pickNum(n["sugars_100g"]),
    fibre:    pickNum(n["fiber_100g"]),
    salt:     pickNum(n["salt_100g"], sodiumToSalt(n["sodium_100g"]))
  };
  const hasPer100 = ["calories","protein","carbs","fat"].some(k => per100[k]!=null);
  return {
    barcode: code,
    name: String(p.product_name || p.product_name_en || p.brands || "Unknown product").trim(),
    brand: String(p.brands||"").split(",")[0].trim(),
    quantity: p.quantity || "",
    servingG: pickNum(p.serving_quantity),
    servingSize: p.serving_size || "",
    per100, hasPer100
  };
}
function pickNum(){ for (let i=0;i<arguments.length;i++){ const v=arguments[i]; if (v!=null && v!=="" && isFinite(Number(v))) return Number(v); } return null; }
function kjToKcal(kj){ const v=Number(kj); return (isFinite(v)&&v)?v/4.184:null; }
function sodiumToSalt(sod){ const v=Number(sod); return (isFinite(v)&&v)?v*2.5:null; }   // salt ≈ sodium × 2.5
function blankMacros(){ const o={}; FOOD_NUTRIENTS.forEach(k=>o[k]=0); return o; }
/* Scale per-100g macros to grams eaten -> macros actually consumed. */
function scaleFromPer100(per100, grams){
  const f = num(grams)/100, out = {};
  FOOD_NUTRIENTS.forEach(k => { out[k] = per100[k]==null ? 0 : round(per100[k]*f, k==="calories"?0:1); });
  return out;
}

/* ---- committing a food (to the day, or to a meal being built) ---- */
function commitFoodEntry(entry){

/* ---- barcode scanner (html5-qrcode, lazy-loaded from CDN) ---- */
const QR_LIB = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
let SCANNER = null;
function loadScannerLib(){
  return new Promise((resolve, reject) => {
    if (window.Html5Qrcode) return resolve();
    const s = document.createElement("script");
    s.src = QR_LIB; s.async = true;
    s.onload = () => window.Html5Qrcode ? resolve() : reject(new Error("scanner unavailable"));
    s.onerror = () => reject(new Error("couldn't load scanner (offline?)"));
    document.head.appendChild(s);
  });
}
async function stopScanner(){
  if (SCANNER){
    try { await SCANNER.stop(); } catch(e){}
    try { await SCANNER.clear(); } catch(e){}
    SCANNER = null;
  }
}
function openScanSheet(){
  const canCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  openSheet(`
    <h3>Scan a barcode</h3>
    <div id="scanReader" style="width:100%;${canCamera?"min-height:240px;":""}border-radius:12px;overflow:hidden;margin-bottom:10px;${canCamera?"background:#000;":""}"></div>
    <div id="scanMsg" class="hint" style="margin-bottom:10px;">${canCamera?"Point the camera at the product barcode.":"Camera unavailable here — type the number below."}</div>
    <label class="field"><span>Or enter the barcode</span>
      <input class="input" id="scanManual" type="text" inputmode="numeric" placeholder="e.g. 5000159407236"></label>
    <button class="btn primary full" onclick="lookupFromInput()">Look up</button>
    <button class="btn ghost full" style="margin-top:8px;" onclick="openFoodSearchSheet('')">🔎 No barcode? Search by name</button>
    <button class="btn ghost full" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>
  `);

async function startScanner(){
  const msg = $("#scanMsg");
  try {
    await loadScannerLib();
    const F = window.Html5QrcodeSupportedFormats, cfg = { fps:10, qrbox:{ width:240, height:140 } };
    if (F) cfg.formatsToSupport = [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF];
    SCANNER = new window.Html5Qrcode("scanReader", { verbose:false });

function onScan(text){

/* ---- search Open Food Facts by name (for anything without a barcode) ----
   Two endpoints are tried in turn: the long-standing CGI search, then the
   newer search service. Both are normalised into the same product shape the
   barcode lookup produces, so the amount/scaling form is shared. */
const OFF_SEARCH_PAGE = 20;
function offSearchUrls(query, page){
  const q = encodeURIComponent(query);
  return [
    `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${q}&search_simple=1&action=process&json=1&page_size=${OFF_SEARCH_PAGE}&page=${page}&fields=code,${OFF_FIELDS}`,
    `https://search.openfoodfacts.org/search?q=${q}&page_size=${OFF_SEARCH_PAGE}&page=${page}`
  ];
}
/* both shapes: {products:[…]} and {hits:[…]} */
function normaliseSearchPayload(data){
  if (!data) return [];
  const list = Array.isArray(data.products) ? data.products
             : Array.isArray(data.hits) ? data.hits : [];
  return list.filter(Boolean).map(p => ({ code: String(p.code || p._id || "").trim(), p }));
}
async function offSearch(query, page){
  const q = String(query||"").trim();
  if (q.length < 2) throw new Error("Type at least two characters");
  const urls = offSearchUrls(q, page||1);
  let lastErr = null;
  for (let i=0; i<urls.length; i++){
    const ctl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    const tm = ctl ? setTimeout(()=>ctl.abort(), 12000) : null;
    try {
      const res = await fetch(urls[i], ctl?{signal:ctl.signal}:{});
      if (!res.ok) throw new Error("HTTP "+res.status);
      const data = await res.json();
      const rows = normaliseSearchPayload(data);
      const parsed = rows
        .map(r => parseOffProduct(r.code, r.p))
        .filter(x => x.name && x.name!=="Unknown product");
      // products with real nutrition data first
      parsed.sort((a,b)=> (b.hasPer100?1:0) - (a.hasPer100?1:0));
      return parsed;
    } catch(e){
      lastErr = e;
    } finally { if (tm) clearTimeout(tm); }
  }
  throw new Error(lastErr ? ("Search unavailable ("+(lastErr.message||lastErr)+")") : "Search unavailable");
}

/* Foods already logged, matched locally — instant, works with no signal, and
   usually what you want when you eat the same things repeatedly. */
function localFoodMatches(query){
  const q = String(query||"").trim().toLowerCase();
  if (!q) return [];
  const seen = {}, out = [];
  STATE.foodLogs.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(f=>{
    if (f.basis==="meal") return;                       // meals are offered separately
    const nm = String(f.name||"").trim();
    if (!nm || nm.toLowerCase().indexOf(q) < 0) return;
    const key = nm.toLowerCase();
    if (seen[key]) return;
    seen[key] = 1;
    out.push({ kind:"food", name:nm, entry:f });
  });
  if (ADD_TARGET.kind === "day"){
    STATE.meals.forEach(m=>{
      const nm = String(m.name||"").trim();
      if (nm && nm.toLowerCase().indexOf(q) >= 0) out.push({ kind:"meal", name:nm, meal:m });
    });
  }
  return out.slice(0,8);
}

      </div>`:""}

async function runFoodSearch(page){
  const el = $("#fsQuery");
  if (el) FOOD_SEARCH.query = el.value;
  const q = String(FOOD_SEARCH.query||"").trim();
  if (q.length < 2){ toast("Type at least two characters"); return; }

  FOOD_SEARCH.local = localFoodMatches(q);
  renderFoodSearchSheet();
  try {
    const results = await offSearch(q, FOOD_SEARCH.page);
    FOOD_SEARCH.results = results;
    FOOD_SEARCH.state = results.length ? "done" : "empty";
  } catch(e){
    FOOD_SEARCH.state = "error";
    FOOD_SEARCH.error = (e.message||String(e)) + " — you can still enter it by hand below.";
  }
  renderFoodSearchSheet();
}
function pickSearchResult(i){
  const p = FOOD_SEARCH.results[i];

/* A food logged before: reuse its per-100g reference if it had one, otherwise
   pre-fill the macros exactly as they were last time. */
function pickLocalFood(i){
  const m = FOOD_SEARCH.local[i];

    openProductForm({ barcode:f.barcode||null, name:f.name, brand:"", quantity:"",
                      per100:{}, hasPer100:false, servingG:null },
                    { amountG:f.amountG||null, macros });
  }
}

function saveFoodEdit(id){
  const f = STATE.foodLogs.find(x=>x.id===id); if(!f) return;
  f.name = (($("#pfName")&&$("#pfName").value)||f.name||"Food").trim();
  const g = $("#pfAmt").value; f.amountG = g===""?null:num(g);
  FOOD_NUTRIENTS.forEach(k => { f[k] = num($("#pf_"+k)&&$("#pf_"+k).value); });
  f.updatedAt = Date.now();
  save(); closeSheet(); toast("Saved"); navigate("nutrition");
}

/* ---- meals / recipes ---- */
function mealTotals(m){
  const t={}; FOOD_NUTRIENTS.forEach(k=>t[k]=0);
  (m.items||[]).forEach(it=>FOOD_NUTRIENTS.forEach(k=>{ t[k]+=num(it[k]); }));
  return t;
}
/* The weight of the finished dish once it's cooked. Cooking drives water off
   (or soaks it up), so this is measured on the scales, not summed from the
   ingredients — which is exactly why it has to be entered separately. */
function mealCookedWeight(m){
  const w = m && m.cookedWeightG!=null ? num(m.cookedWeightG) : 0;
  return w > 0 ? w : null;
}
/* What the ingredients weighed going in — shown as a sanity check only. */
function mealItemsWeight(m){
  let w = 0, known = false;
  (m && m.items || []).forEach(it => { if (it.amountG!=null){ w += num(it.amountG); known = true; } });
  return known ? w : null;
}
/* Prepared meal expressed per 100 g, so a portion scales exactly like a
   scanned product does. */
function mealPer100(m){
  const w = mealCookedWeight(m);
  if (!w) return null;
  const t = mealTotals(m), o = {};
  FOOD_NUTRIENTS.forEach(k => o[k] = num(t[k]) / w * 100);
  return o;
}
/* Macros for the portion actually eaten: (portion / prepared weight) x total. */
function mealPortionMacros(m, grams){
  const per100 = mealPer100(m);
  if (!per100) return mealTotals(m);
  return scaleFromPer100(per100, grams);
}
function mealPortionLabel(m, grams){
  const w = mealCookedWeight(m);
  if (!w || !grams) return "";
  const pct = grams / w * 100;
  return `${fmt(pct,0)}% of the meal`;
}
function saveMealWeight(){
  const m = STATE.meals.find(x=>x.id===EDIT_MEAL); if(!m) return;
  const el = $("#mealWeight");
  const v = el ? el.value : "";
  m.cookedWeightG = (v==="" ? null : Math.max(0, num(v)));
  m.updatedAt = Date.now();
  save(); navigate("mealEdit");
}
function useRawWeight(){
  const m = STATE.meals.find(x=>x.id===EDIT_MEAL); if(!m) return;
  const raw = mealItemsWeight(m);
  if (!raw){ toast("No ingredient weights to add up"); return; }
  m.cookedWeightG = round(raw,0); m.updatedAt = Date.now();
  save(); toast("Set from ingredients"); navigate("mealEdit");
}
function newMeal(){
  const m = { id:uid("meal"), name:"New meal", createdAt:Date.now(), updatedAt:Date.now(), cookedWeightG:null, items:[] };
  STATE.meals.push(m); EDIT_MEAL=m.id; ADD_TARGET={kind:"day"}; save(); closeSheet(); navigate("mealEdit");
}
function editMeal(id){ EDIT_MEAL=id; navigate("mealEdit"); }
function deleteMeal(id){ STATE.meals = STATE.meals.filter(m=>m.id!==id); save(); toast("Meal deleted"); navigate("meals"); }
function renameMeal(){ const m=STATE.meals.find(x=>x.id===EDIT_MEAL); if(!m)return; m.name=($("#mealName").value||"").trim()||"Meal"; m.updatedAt=Date.now(); save(); }
function deleteMealItem(id){ const m=STATE.meals.find(x=>x.id===EDIT_MEAL); if(!m)return; m.items=m.items.filter(i=>i.id!==id); m.updatedAt=Date.now(); save(); navigate("mealEdit"); }
function mealScan(){ ADD_TARGET={kind:"meal", id:EDIT_MEAL}; openScanSheet(); }
function mealAddFood(){ ADD_TARGET={kind:"meal", id:EDIT_MEAL}; openFoodItemSheet(); }
/* Called with no grams: if the meal has a prepared weight, ask how much was
   eaten first; otherwise log the whole thing as before. */
function logMeal(mealId, grams){
  const m = STATE.meals.find(x=>x.id===mealId); if(!m) return;
  const w = mealCookedWeight(m);
  if (w && grams==null){ openMealPortionSheet(mealId); return; }

  const d = screenDate("nutrition");
  const useGrams = (w && grams!=null) ? num(grams) : null;
  const macros = useGrams!=null ? mealPortionMacros(m, useGrams) : mealTotals(m);
  STATE.foodLogs.push(Object.assign({ id:uid("food"), date:d, source:"food", createdAt:Date.now(),
    name:m.name||"Meal", basis:"meal", amountG:useGrams, per100:mealPer100(m), mealId:m.id }, macros));
  save(); closeSheet();
  toast(useGrams!=null ? `Logged ${fmt(useGrams,0)} g of ${m.name||"meal"}` : "Meal logged");
  navigate("nutrition");
}
let CURRENT_PORTION_MEAL = null;   // meal whose portion sheet is open

      <button class="btn sm ghost" onclick="setPortion(${round(w,0)})">All of it</button>
    </div>
    <div class="card" id="mpPreview" style="margin-bottom:12px;">${mealPortionPreview(m, half)}</div>
    <button class="btn primary full" onclick="confirmMealPortion('${m.id}')">Add to ${esc(prettyDate(screenDate("nutrition")))}</button>
    <button class="btn ghost full" style="margin-top:8px;" onclick="logMeal('${m.id}', ${round(w,0)})">Log the whole meal</button>
    <button class="btn ghost full" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>

}
function mealPortionPreview(m, grams){
  const p = mealPortionMacros(m, grams);
  return `<div class="row spread" style="align-items:baseline;">
      <span class="eyebrow">That works out as</span>
      <span class="hint">${esc(mealPortionLabel(m, grams))}</span>
    </div>
    <div class="stat-big" style="margin:6px 0 8px;">${fmt(p.calories,0)}<span class="m-unit" style="font-size:.8rem;"> kcal</span></div>
    <div class="hint">P ${fmt(p.protein,1)} g · C ${fmt(p.carbs,1)} g · F ${fmt(p.fat,1)} g</div>`;
}
function setPortion(g){ const el=$("#mpAmt"); if(el){ el.value=numVal(g,0); recalcPortion(); } }
function recalcPortion(){
  const box = $("#mpPreview"), el = $("#mpAmt");
  if (!box || !el || !CURRENT_PORTION_MEAL) return;
  box.innerHTML = mealPortionPreview(CURRENT_PORTION_MEAL, num(el.value));
}

  logMeal(mealId, g);
}

/* =====================================================================
   SECTION 10 — GROOMING  (shaves and haircuts, each with a due date)
   ===================================================================== */
const GROOM_TYPES = [
  { key:"shave",   lab:"Shave",   ic:"🪒", past:"Last shave",   act:"Log a shave",   defaultDays:3  },
  { key:"haircut", lab:"Haircut", ic:"💈", past:"Last haircut", act:"Log a haircut", defaultDays:28 }
];
function groomType(key){ return GROOM_TYPES.find(t=>t.key===key) || GROOM_TYPES[0]; }
function daysBetween(fromIsoDate, toIsoDate){
  return Math.round((fromISO(toIsoDate) - fromISO(fromIsoDate)) / 86400000);
}
/* How often you want to do each, from settings, with a sane fallback. */
function groomInterval(type){
  const cfg = STATE.settings.groomingIntervals || {};
  const def = groomType(type).defaultDays;
  const v = num(cfg[type], def);
  return v > 0 ? v : def;
}
function groomLogs(type){ return STATE.groomingLogs.filter(g=>g.type===type).sort(byDateDesc); }
function lastGroom(type){ return groomLogs(type)[0] || null; }

/* Everything the UI needs about one grooming habit, in one object. */
function groomStatus(type){
  const last = lastGroom(type), interval = groomInterval(type), today = todayISO();
  if (!last) return { type, last:null, interval, state:"none" };
  const daysSince = daysBetween(last.date, today);
  const due = addDays(last.date, interval);
  const daysUntil = daysBetween(today, due);
  const state = daysUntil < 0 ? "overdue" : (daysUntil === 0 ? "due" : "ok");
  return { type, last, interval, daysSince, due, daysUntil, state };
}
function plural(n,word){ return `${n} ${word}${Math.abs(n)===1?"":"s"}`; }
function groomSinceText(s){
  if (s.state==="none") return "Never logged";
  if (s.daysSince===0) return "Today";
  if (s.daysSince===1) return "Yesterday";
  return plural(s.daysSince,"day") + " ago";
}
function groomDueText(s){
  if (s.state==="none") return "Not started";
  if (s.state==="overdue") return `Overdue by ${plural(Math.abs(s.daysUntil),"day")}`;
  if (s.state==="due") return "Due today";
  return `Due in ${plural(s.daysUntil,"day")}`;
}
/* 100% = just done, 0% = due (or past it). Drives the meters. */
function groomFreshPct(type){
  const s = groomStatus(type);
  if (s.state==="none") return 0;
  return Math.round(clamp((1 - s.daysSince / s.interval) * 100, 0, 100));
}
function groomPillClass(s){
  return s.state==="overdue" ? "bad" : s.state==="due" ? "warn" : s.state==="none" ? "neutral" : "good";
}
/* Your real-world cadence, to compare against the target interval. */
function groomAvgGap(type){
  const logs = groomLogs(type);
  if (logs.length < 2) return null;
  let total = 0;
  for (let i=0; i<logs.length-1; i++) total += daysBetween(logs[i+1].date, logs[i].date);
  return total / (logs.length-1);
}

function logGroom(type, date){
  const d = date || todayISO();
  STATE.groomingLogs.push({ id:uid("grm"), date:d, type, source:"grooming", createdAt:Date.now() });
  save(); closeSheet(); toast(groomType(type).lab + " logged"); navigate("grooming");
}
function deleteGroom(id){
  STATE.groomingLogs = STATE.groomingLogs.filter(g=>g.id!==id);
  save(); toast("Removed"); navigate("grooming");
}
/* Backdating, for when you remember two days later. */
function openGroomSheet(type){
  const t = groomType(type);
  openSheet(`
    <h3>${t.act}</h3>
    <p class="hint" style="margin-bottom:12px;">Defaults to today — change the date if you're catching up.</p>
    <label class="field"><span>Date</span>
      <input class="input" id="grmDate" type="date" value="${todayISO()}" max="${todayISO()}"></label>
    <button class="btn primary full" onclick="logGroom('${t.key}', $('#grmDate').value || todayISO())">${t.act}</button>
    <button class="btn ghost full" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>
  `);
}

function groomCard(type){
  const t = groomType(type), s = groomStatus(type);
  const pct = groomFreshPct(type), gap = groomAvgGap(type);
  const all = groomLogs(type), recent = all.slice(0,5);
  const fillCol = s.state==="overdue" ? "var(--bad)" : s.state==="due" ? "var(--warn)" : "var(--care)";
  return `
    <div class="card">
      <div class="row spread" style="align-items:flex-start;gap:12px;">
        <div style="min-width:0;">
          <div class="eyebrow">${t.past}</div>
          <div class="stat-big" style="margin-top:5px;">${groomSinceText(s)}</div>
          <div class="muted" style="font-size:.84rem;margin-top:3px;">
            ${s.last ? prettyDate(s.last.date) : `Target: every ${plural(s.interval,"day")}`}</div>
        </div>
        <span class="pill ${groomPillClass(s)}" style="flex:none;">${groomDueText(s)}</span>
      </div>

      <div class="meter" style="margin-top:15px;"><i style="width:${pct}%;background:${fillCol};"></i></div>
      <div class="row spread" style="margin-top:7px;">
        <span class="hint">Every ${plural(s.interval,"day")}${gap!=null?` · you average ${fmt(gap,1)}`:""}</span>
        ${s.state==="ok"?`<span class="hint">${prettyDate(s.due)}</span>`:""}
      </div>

      <div class="btn-row" style="margin-top:15px;">
        <button class="btn primary" onclick="logGroom('${t.key}')">${t.ic} Did it today</button>
        <button class="btn ghost" onclick="openGroomSheet('${t.key}')">Another day</button>
      </div>

      ${recent.length?`
        <div class="divider"></div>
        <div class="eyebrow" style="margin-bottom:4px;">Recent</div>
        ${recent.map((g,i)=>{
          const older = all[i+1];
          const gapTxt = older ? `${plural(daysBetween(older.date,g.date),"day")} on from the last` : "first one logged";
          return `<div class="kv"><span class="k">${prettyDate(g.date)} <span class="faint">· ${gapTxt}</span></span>
            <span class="v"><button class="iconbtn" onclick="deleteGroom('${g.id}')">🗑️</button></span></div>`;
        }).join("")}`:""}
    </div>`;
}

SCREENS.grooming = {
  title: "Grooming",
  render(){
    return `
      <p class="hint" style="margin:0 2px 14px;">How long it's been, and when you're next due. Set how often you want each in Settings.</p>
      ${GROOM_TYPES.map(t=>groomCard(t.key)).join("")}
    `;
  }
};

/* short home-tile summary, e.g. "Shave due · Cut 12d" */
function groomHomeMeta(){
  return GROOM_TYPES.map(t=>{
    const s = groomStatus(t.key), nm = t.key==="haircut" ? "Cut" : "Shave";
    if (s.state==="none") return `${nm} —`;
    if (s.state==="overdue") return `${nm} overdue`;
    if (s.state==="due") return `${nm} due`;
    return `${nm} ${s.daysUntil}d`;
  }).join(" · ");
}

function saveProteinRule(){
  const el = $("#set_ppk");
  if (el) STATE.settings.proteinPerKg = Math.max(0.1, num(el.value, STATE.settings.proteinPerKg));
  save(); toast("Protein rule saved"); navigate("settings");
}

function saveGroomingSettings(){
  const g = STATE.settings.groomingIntervals;
  GROOM_TYPES.forEach(t => {
    const el = $("#grm_"+t.key);
    if (el) g[t.key] = Math.max(1, Math.round(num(el.value, t.defaultDays)));
  });
  save(); toast("Grooming intervals saved"); navigate("settings");
}

/* =====================================================================
   SECTION 11 — SCALE IMPORT  (CSV export from the RENPHO app)
   ===================================================================== */
const LB_TO_KG = 0.45359237, ST_TO_KG = 6.35029318;
const MASS_KEYS = ["weight","fatFreeMass","muscleMass","boneMass"];
/* RENPHO's column names normalise straight onto our metric keys; the aliases
   cover the wordings it has used in other exports and locales. */
const SCALE_ALIASES = {
  bodyfatrate:"bodyFat", bodyfatpercentage:"bodyFat", fat:"bodyFat",
  skeletalmusclerate:"skeletalMuscle", skeletalmusclepercentage:"skeletalMuscle",
  bodywaterrate:"bodyWater", water:"bodyWater",
  proteinrate:"protein", proteinpercentage:"protein",
  leanbodymass:"fatFreeMass", fatfreebodyweight:"fatFreeMass", fatfree:"fatFreeMass",
  basalmetabolicrate:"bmr", basalmetabolism:"bmr",
  subcutaneousfatrate:"subcutaneousFat", visceralfatindex:"visceralFat",
  musclemasskg:"muscleMass", bodymassindex:"bmi", bodyage:"metabolicAge"
};
function scaleKeyFor(normalised){
  const direct = BODY_METRICS.find(m => m.key.toLowerCase() === normalised);
  if (direct) return direct.key;
  return SCALE_ALIASES[normalised] || null;
}
/* "Body Fat(%)" -> { name:"bodyfat", unit:"%" };  "Protein (%)" -> same shape */
function splitHeaderCell(cell){
  const raw = String(cell||"").trim();
  const m = raw.match(/^([^(]*)\(([^)]*)\)\s*$/);
  const namePart = m ? m[1] : raw;
  const unit = m ? m[2].trim().toLowerCase() : "";
  return { name: namePart.toLowerCase().replace(/[^a-z0-9]/g,""), unit };
}
/* quote-aware single-line CSV split (Remarks can legitimately contain commas) */
function parseCsvLine(line){
  const out = []; let cur = "", inQ = false;
  for (let i=0;i<line.length;i++){
    const c = line[i];
    if (inQ){
      if (c === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ","){ out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(v=>v.trim());
}
function isBlankCell(v){
  const t = String(v==null?"":v).trim().toLowerCase();
  return t==="" || t==="--" || t==="-" || t==="n/a" || t==="na" || t==="null";
}
/* RENPHO writes UK-style dd/mm/yyyy; ISO and dotted forms are accepted too. */
function parseScaleDate(str){
  const t = String(str||"").trim();
  if (!t) return null;
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${String(+m[2]).padStart(2,"0")}-${String(+m[3]).padStart(2,"0")}`;
  m = t.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
  if (m){
    let a = +m[1], b = +m[2];
    // day-first unless the first number can only be a month
    if (a > 12 && b <= 12){ /* dd/mm */ }
    else if (b > 12 && a <= 12){ const tmp = a; a = b; b = tmp; }   // mm/dd
    if (a<1 || a>31 || b<1 || b>12) return null;
    return `${m[3]}-${String(b).padStart(2,"0")}-${String(a).padStart(2,"0")}`;
  }
  return null;
}
function convertMass(value, unit){
  if (unit==="lb" || unit==="lbs") return value * LB_TO_KG;
  if (unit==="st") return value * ST_TO_KG;
  return value;
}

/* Turn the file text into { readings, ignored, badDates, noData }. */
function parseScaleCsv(text){
  const lines = String(text||"").split(/\r\n|\r|\n/).filter(l=>l.trim()!=="");
  if (!lines.length) throw new Error("The file is empty");

  // find the header row: the first line that maps at least two known metrics
  let headerIdx = -1, cols = null, dateIdx = -1, timeIdx = -1, ignored = [];
  for (let i=0; i<Math.min(lines.length,10); i++){
    const cells = parseCsvLine(lines[i]);
    const mapped = [], skipped = [];
    let di = -1, ti = -1;
    cells.forEach((cell,idx)=>{
      const { name, unit } = splitHeaderCell(cell);
      if (name==="date"){ di = idx; return; }
      if (name==="time"){ ti = idx; return; }
      const key = scaleKeyFor(name);
      if (key) mapped.push({ idx, key, unit });
      else if (cell.trim()) skipped.push(cell.trim());
    });
    if (di >= 0 && mapped.length >= 1){
      headerIdx = i; cols = mapped; dateIdx = di; timeIdx = ti; ignored = skipped; break;
    }
  }
  if (headerIdx < 0) throw new Error("Couldn't find a header row with a Date column and recognisable measurements");

  const byDate = {};
  let badDates = 0, noData = 0;
  for (let i=headerIdx+1; i<lines.length; i++){
    const cells = parseCsvLine(lines[i]);
    const iso = parseScaleDate(cells[dateIdx]);
    if (!iso){ badDates++; continue; }
    const metrics = {};
    cols.forEach(c=>{
      const raw = cells[c.idx];
      if (isBlankCell(raw)) return;
      const v = parseFloat(String(raw).replace(/[^0-9.\-]/g,""));
      if (!isFinite(v)) return;
      metrics[c.key] = MASS_KEYS.indexOf(c.key)>=0 ? round(convertMass(v, c.unit), 2) : v;
    });
    if (!Object.keys(metrics).length){ noData++; continue; }
    const time = timeIdx>=0 ? String(cells[timeIdx]||"").trim() : "";
    // later reading on the same day wins
    const prev = byDate[iso];
    if (!prev || time >= prev.time) byDate[iso] = { date:iso, time, metrics };
  }
  const readings = Object.keys(byDate).sort().map(k=>byDate[k]);
  if (!readings.length) throw new Error("No usable rows — dates or measurements couldn't be read");
  return { readings, ignored, badDates, noData, mappedCount: cols.length };
}

let SCALE_IMPORT = null;   // parsed file awaiting confirmation

function readScaleCsv(input){
  const file = input.files && input.files[0];
  input.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      SCALE_IMPORT = parseScaleCsv(reader.result);
      openScaleImportSheet(file.name);
    } catch(e){
      openSheet(`<h3>Couldn't read that file</h3>
        <p class="hint" style="margin-bottom:12px;">${esc(e.message||String(e))}</p>
        <p class="hint" style="margin-bottom:12px;">Export again from the RENPHO app using <b>Profile ▸ Export data</b> and pick CSV.</p>
        <button class="btn ghost full" onclick="closeSheet()">Close</button>`);
    }
  };
  reader.onerror = () => toast("Couldn't read the file");
  reader.readAsText(file);
}

function scaleImportSplit(){
  const existing = {};
  STATE.bodyCompositionLogs.forEach(l=>existing[l.date]=1);
  const fresh = SCALE_IMPORT.readings.filter(r=>!existing[r.date]);
  const dupes = SCALE_IMPORT.readings.filter(r=>existing[r.date]);
  return { fresh, dupes };
}
function openScaleImportSheet(filename){
  const p = SCALE_IMPORT, { fresh, dupes } = scaleImportSplit();
  const first = p.readings[0].date, last = p.readings[p.readings.length-1].date;
  const skippedBits = [];
  if (p.badDates) skippedBits.push(`${p.badDates} row${p.badDates===1?"":"s"} with an unreadable date`);
  if (p.noData) skippedBits.push(`${p.noData} empty row${p.noData===1?"":"s"}`);
  openSheet(`
    <h3>Import from your scales</h3>
    <p class="hint" style="margin-bottom:12px;">${esc(filename||"CSV")} — ${p.readings.length} reading${p.readings.length===1?"":"s"}
      from ${prettyDate(first)} to ${prettyDate(last)}, ${p.mappedCount} measurements per reading.</p>

    <div class="card" style="margin-bottom:12px;">
      <div class="kv"><span class="k">New days</span><span class="v">${fresh.length}</span></div>
      <div class="kv"><span class="k">Days already logged</span><span class="v">${dupes.length}</span></div>
      ${skippedBits.length?`<div class="kv"><span class="k">Skipped</span><span class="v">${esc(skippedBits.join(" · "))}</span></div>`:""}
    </div>

    <div class="eyebrow" style="margin-bottom:6px;">Most recent readings</div>
    ${p.readings.slice(-4).reverse().map(r=>`
      <div class="kv"><span class="k">${prettyDate(r.date)}</span>
        <span class="v">${r.metrics.weight!=null?fmt(r.metrics.weight,2)+" kg":"–"}${r.metrics.bodyFat!=null?` · ${fmt(r.metrics.bodyFat,1)}% fat`:""}</span></div>`).join("")}

    <button class="btn primary full" style="margin-top:14px;" onclick="applyScaleImport('new')" ${fresh.length?"":"disabled"}>
      ${fresh.length?`Add ${fresh.length} new day${fresh.length===1?"":"s"}`:"Nothing new to add"}</button>
    ${dupes.length?`<button class="btn ghost full" style="margin-top:8px;" onclick="applyScaleImport('all')">
      Import all ${p.readings.length}, replacing the ${dupes.length} existing</button>`:""}
    <button class="btn ghost full" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>
    ${p.ignored.length?`<p class="hint" style="margin-top:12px;">Columns ignored: ${esc(p.ignored.slice(0,6).join(", "))}${p.ignored.length>6?` and ${p.ignored.length-6} more`:""}.</p>`:""}
  `);
}
function applyScaleImport(mode){
  if (!SCALE_IMPORT){ closeSheet(); return; }
  const rows = mode==="all" ? SCALE_IMPORT.readings : scaleImportSplit().fresh;
  let added = 0, updated = 0;
  rows.forEach(r=>{
    let log = STATE.bodyCompositionLogs.find(l=>l.date===r.date);
    if (!log){
      log = { id:uid("body"), date:r.date, source:"scale", createdAt:Date.now() };
      STATE.bodyCompositionLogs.push(log);
      added++;
    } else updated++;
    BODY_METRICS.forEach(m => { if (r.metrics[m.key]!=null) log[m.key] = r.metrics[m.key]; });
    if (r.time) log.readingTime = r.time;
    log.source = log.source || "scale";
    log.updatedAt = Date.now();
  });
  save();
  SCALE_IMPORT = null;
  closeSheet();
  const parts = [];
  if (added) parts.push(`${added} added`);
  if (updated) parts.push(`${updated} updated`);
  toast(parts.length?parts.join(" · "):"Nothing to import");
  navigate("body");
}

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  try { await loadState(); }
  catch(e){ console.warn("Load failed, using defaults", e); STATE = defaultState(); }
  if (backfillMissedWorkouts()) save();          // auto-log any past unlogged days
  applySettings();
  navigate("home");
})();

</script>
