<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090B10">
<title>Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   DAILY — visual system
   Direction: a backlit instrument panel. Cool ink surfaces, one electric
   accent, hairline rules, tabular figures, and a five-channel meter strip
   on the home screen that reads today at a glance like a mixing desk.
   ========================================================================= */
:root{
  /* accent is user-selectable; --accent-soft is derived in applySettings() */
  --accent:#6E7BFF;
  --accent-soft:rgba(110,123,255,.16);

  /* data hues — each domain keeps its own colour everywhere it appears */
  --hydration:#3AC8F5;
  --caffeine:#F5A524;
  --sugar:#FF6FB5;
  --alcohol:#FF5C5C;
  --care:#A78BFA;
  --good:#2FD98D;
  --warn:#FFC94D;
  --bad:#FF5C5C;

  --radius:18px;
  --radius-sm:12px;
  --gap:13px;
  --tap:48px;

  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Space Grotesk","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fs-base:16px;
}
html[data-theme="dark"]{
  --bg:#090B10;
  --bg-2:#0F131B;
  --card:#151A23;
  --card-2:#1D232E;
  --field:#11161E;
  --track:#0E121A;
  --dock:rgba(21,26,35,.82);
  --glass:rgba(9,11,16,.72);
  --text:#F2F5FA;
  --text-dim:#98A2B8;
  --text-faint:#6B7488;
  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.14);
  --edge:rgba(255,255,255,.06);
  --shadow:0 12px 34px rgba(0,0,0,.44);
}
html[data-theme="light"]{
  --bg:#F5F7FB;
  --bg-2:#ECEFF5;
  --card:#FFFFFF;
  --card-2:#F3F6FB;
  --field:#FFFFFF;
  --track:#E7ECF4;
  --dock:rgba(255,255,255,.86);
  --glass:rgba(245,247,251,.78);
  --text:#0F131A;
  --text-dim:#5B6478;
  --text-faint:#8C94A6;
  --border:rgba(15,19,26,.09);
  --border-strong:rgba(15,19,26,.16);
  --edge:rgba(255,255,255,.9);
  --shadow:0 10px 28px rgba(15,19,26,.09);
}
html[data-large="true"]{ --fs-base:18px; }
html[data-compact="true"]{ --gap:9px; --radius:15px; }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font);
  font-size:var(--fs-base);
  background:var(--bg);
  color:var(--text);
  line-height:1.42;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background .3s ease,color .3s ease;
  min-height:100vh;
}
button{ font-family:inherit; font-size:inherit; cursor:pointer; color:inherit; }
input,select,textarea{ font-family:inherit; font-size:1rem; color:var(--text); }
input[type=number]{ -moz-appearance:textfield; }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

/* every figure in the app lines up in columns */
.stat-big,.desk-score,.ch-val,.kv .v,.metric .m-val,.timer .tdisp,.cd-num,.set-table input,
.tt-row input,.trend,.m-chg{ font-variant-numeric:tabular-nums; }

/* =========================================================================
   FRAME
   ========================================================================= */
#app{
  max-width:520px; margin:0 auto; min-height:100vh; position:relative; z-index:1;
  padding:0 16px calc(env(safe-area-inset-bottom) + 108px);
}
#waterFill{
  position:fixed; left:0; right:0; bottom:0; height:0%;
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--hydration) 26%, transparent),
    color-mix(in srgb, var(--hydration) 46%, transparent));
  z-index:0; pointer-events:none; transition:height .8s cubic-bezier(.22,1,.36,1); opacity:0;
}
#waterFill::before{
  content:""; position:absolute; top:-20px; left:0; right:0; height:24px;
  background:radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--hydration) 42%, transparent), transparent 72%);
}
body.hydration-active #waterFill{ opacity:1; }

/* =========================================================================
   HEADER
   ========================================================================= */
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:flex-end; gap:10px;
  margin:0 -16px 4px;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:var(--glass); backdrop-filter:blur(16px) saturate(150%);
}
.topbar .ttl-wrap{ flex:1; min-width:0; }
.topbar h1{
  font-family:var(--font-display); font-size:1.75rem; font-weight:700;
  letter-spacing:-.035em; margin:1px 0 0; line-height:1.05;
}
.topbar .sub{ font-size:.8rem; color:var(--text-dim); font-weight:500; }
.eyebrow{
  font-size:.62rem; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  color:var(--text-faint);
}
.back-btn{
  display:none; align-items:center; gap:3px; background:none; border:none;
  color:var(--accent); font-size:.95rem; font-weight:600; padding:6px 4px 8px 0; margin-left:-4px;
}
.back-btn svg{ width:19px; height:19px; }
.screen-title{ font-family:var(--font-display); font-size:1.45rem; font-weight:700; letter-spacing:-.025em; margin:2px 0 14px; }
.screen-date{ font-size:.82rem; color:var(--text-dim); font-weight:500; margin:0 0 14px; }

/* =========================================================================
   SURFACES
   ========================================================================= */
.card{
  position:relative; background:var(--card); border-radius:var(--radius);
  padding:16px; margin-bottom:var(--gap);
  border:1px solid var(--border); box-shadow:var(--shadow);
}
/* a 1px lit edge along the top — reads as backlit hardware */
.card::before,.desk::before,.tile::before{
  content:""; position:absolute; left:14px; right:14px; top:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--edge), transparent); pointer-events:none;
}
.card.flush{ padding:0; overflow:hidden; }
.card h3{ font-family:var(--font-display); margin:0 0 11px; font-size:1rem; font-weight:600; letter-spacing:-.015em; }
.card .hint{ color:var(--text-dim); font-size:.81rem; }
.muted{ color:var(--text-dim); }
.faint{ color:var(--text-faint); }
.row{ display:flex; gap:10px; align-items:center; }
.row.wrap{ flex-wrap:wrap; }
.spread{ justify-content:space-between; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.spacer{ height:6px; }
.divider{ height:1px; background:var(--border); margin:13px 0; }
.section-h{
  font-family:var(--font-display); font-size:.7rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint);
  margin:22px 2px 10px; display:flex; align-items:center; gap:9px;
}
.section-h::after{ content:""; flex:1; height:1px; background:var(--border); }
.hint{ color:var(--text-dim); font-size:.81rem; }

/* =========================================================================
   SIGNATURE — the desk: five channels reading today at a glance
   ========================================================================= */
.desk{
  position:relative; background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:15px 14px 13px; margin-bottom:var(--gap);
  box-shadow:var(--shadow); overflow:hidden;
}
.desk-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 2px 13px; }
.desk-score{ font-family:var(--font-display); font-size:1.45rem; font-weight:700; letter-spacing:-.035em; line-height:1; }
.desk-score small{ font-size:.6rem; font-weight:600; color:var(--text-faint); letter-spacing:.08em; margin-left:3px; }
.desk-strip{ display:grid; grid-template-columns:repeat(5,1fr); gap:7px; align-items:end; }
.ch{ background:none; border:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:7px; }
.ch-track{
  position:relative; width:100%; height:78px; border-radius:11px;
  background:var(--track); border:1px solid var(--border); overflow:hidden;
}
/* faint scale lines, like a level meter */
.ch-track::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(to top, transparent 0 14px, var(--border) 14px 15px);
}
.ch-fill{
  position:absolute; left:0; right:0; bottom:0; display:block; height:0;
  border-radius:10px; transition:height .85s cubic-bezier(.22,1,.36,1);
}
.ch-val{ font-family:var(--font-display); font-size:.78rem; font-weight:600; line-height:1; }
.ch-lab{ font-size:.55rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
.ch:active .ch-track{ border-color:var(--border-strong); }

/* =========================================================================
   HOME TILES
   ========================================================================= */
.home-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
.tile{
  position:relative; overflow:hidden; background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:15px; text-align:left; min-height:106px;
  display:flex; flex-direction:column; justify-content:space-between; gap:10px;
  box-shadow:var(--shadow); transition:transform .13s ease, border-color .2s ease;
}
.tile:active{ transform:scale(.975); border-color:var(--border-strong); }
.tile .ic{
  font-size:1.05rem; line-height:1; width:34px; height:34px; border-radius:11px;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--card-2); border:1px solid var(--border);
}
.tile .nm{ font-family:var(--font-display); font-weight:600; font-size:.97rem; letter-spacing:-.015em; }
.tile .meta{ font-size:.76rem; color:var(--text-dim); margin-top:3px; min-height:1.1em; }
.tile .badge-dot{ position:absolute; top:15px; right:15px; width:8px; height:8px; border-radius:50%; }

/* =========================================================================
   BUTTONS
   ========================================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:var(--tap); padding:0 16px; border-radius:13px;
  border:1px solid var(--border-strong); background:var(--card-2); color:var(--text);
  font-weight:600; font-size:.92rem; letter-spacing:-.005em;
  transition:transform .1s ease, opacity .2s ease, filter .2s ease; user-select:none;
}
.btn:active{ transform:scale(.975); }
.btn.full{ width:100%; }
.btn.primary{ background:var(--accent); border-color:transparent; color:#fff; box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.good{ background:var(--good); border-color:transparent; color:#04210d; }
.btn.warn{ background:var(--warn); border-color:transparent; color:#2a2400; }
.btn.bad{ background:var(--bad); border-color:transparent; color:#fff; }
.btn.ghost{ background:transparent; border-color:var(--border-strong); }
.btn.sm{ min-height:38px; padding:0 13px; font-size:.83rem; border-radius:11px; }
.btn.tiny{ min-height:30px; padding:0 9px; font-size:.76rem; border-radius:9px; }
.btn[disabled]{ opacity:.38; pointer-events:none; }
.btn-row{ display:flex; gap:9px; flex-wrap:wrap; }
.btn-row .btn{ flex:1; min-width:0; }
.iconbtn{
  width:38px; height:38px; min-height:0; padding:0; border-radius:11px;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--card-2); border:1px solid var(--border); font-size:1.05rem;
  transition:transform .1s ease, border-color .2s ease;
}
.iconbtn:active{ transform:scale(.94); }

/* =========================================================================
   FIELDS
   ========================================================================= */
label.field{ display:block; margin-bottom:12px; }
label.field > span{
  display:block; font-size:.7rem; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;
}
.input, input.input, select.input, textarea.input{
  width:100%; background:var(--field); color:var(--text); border:1px solid var(--border-strong);
  border-radius:12px; padding:12px 13px; min-height:var(--tap); outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
textarea.input{ min-height:64px; resize:vertical; }
.input-unit{ position:relative; }
.input-unit .u{ position:absolute; right:13px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:.84rem; pointer-events:none; }
.input-unit input{ padding-right:46px; }
.field-row{ display:flex; gap:10px; align-items:flex-end; }
.field-row .field{ flex:1; margin-bottom:0; }
.seg{ display:flex; background:var(--card-2); border-radius:12px; padding:3px; gap:3px; border:1px solid var(--border); }
.seg button{
  flex:1; min-height:36px; border:none; border-radius:9px; background:transparent;
  color:var(--text-dim); font-weight:600; font-size:.83rem; transition:background .18s ease, color .18s ease;
}
.seg button.on{ background:var(--accent); color:#fff; }
.toggle{
  width:50px; height:30px; border-radius:15px; background:var(--card-2);
  border:1px solid var(--border-strong); position:relative; transition:background .22s ease, border-color .22s ease; flex:none;
}
.toggle .knob{
  position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%;
  background:#fff; transition:left .22s cubic-bezier(.3,1.4,.5,1); box-shadow:0 1px 4px rgba(0,0,0,.35);
}
.toggle.on{ background:var(--good); border-color:transparent; }
.toggle.on .knob{ left:22px; }

/* =========================================================================
   STATS / PROGRESS
   ========================================================================= */
.stat-big{ font-family:var(--font-display); font-size:1.95rem; font-weight:700; letter-spacing:-.04em; line-height:1; }
.stat-label{ font-size:.7rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint); margin-top:5px; }
.bar{ height:8px; background:var(--track); border-radius:5px; overflow:hidden; border:1px solid var(--border); }
.bar > i, .bar > .fillb{ display:block; height:100%; border-radius:5px; background:var(--accent); transition:width .6s cubic-bezier(.22,1,.36,1); }
.meter{ height:10px; background:var(--track); border-radius:6px; overflow:hidden; border:1px solid var(--border); }
.meter > i{ display:block; height:100%; border-radius:6px; background:var(--accent); transition:width .6s cubic-bezier(.22,1,.36,1); }
.ring{ display:inline-grid; place-items:center; }
.chips{ display:flex; gap:7px; flex-wrap:wrap; }
.chip{ font-size:.71rem; font-weight:600; padding:4px 10px; border-radius:20px; background:var(--card-2); border:1px solid var(--border); }
.chip.blue{ color:var(--hydration); } .chip.orange{ color:var(--caffeine); }
.chip.pink{ color:var(--sugar); } .chip.red{ color:var(--alcohol); }
.pill{ font-size:.68rem; font-weight:600; padding:4px 9px; border-radius:8px; letter-spacing:.01em; white-space:nowrap; }
.pill.good{ background:color-mix(in srgb, var(--good) 15%, transparent); color:var(--good); }
.pill.warn{ background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
.pill.bad{ background:color-mix(in srgb, var(--bad) 15%, transparent); color:var(--bad); }
.pill.neutral{ background:var(--card-2); color:var(--text-dim); }
.trend{ font-size:.84rem; font-weight:600; }
.trend.up{ color:var(--good); } .trend.down{ color:var(--bad); } .trend.flat{ color:var(--text-dim); }
.tgt-box{
  background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 26%, transparent);
  border-radius:14px; padding:13px 15px; margin-bottom:14px;
}
.tgt-box .tgt-lab{ font-size:.66rem; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.11em; }
.tgt-box .tgt-val{ font-family:var(--font-display); font-size:1.2rem; font-weight:600; margin-top:4px; }
.warnbox{
  background:color-mix(in srgb, var(--warn) 11%, transparent);
  border:1px solid color-mix(in srgb, var(--warn) 28%, transparent);
  color:var(--warn); border-radius:13px; padding:11px 14px; font-size:.85rem; font-weight:500; margin-bottom:14px;
}
.label-sm{ font-size:.7rem; color:var(--text-faint); font-weight:600; letter-spacing:.08em; text-transform:uppercase; margin-bottom:7px; }

.kv{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.kv:last-child{ border-bottom:none; }
.kv .k{ color:var(--text-dim); font-size:.86rem; }
.kv .v{ font-weight:600; }

.metric-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.metric{ background:var(--card-2); border:1px solid var(--border); border-radius:14px; padding:12px; }
.metric .m-lab{ font-size:.64rem; color:var(--text-faint); font-weight:600; letter-spacing:.09em; text-transform:uppercase; }
.metric .m-val{ font-family:var(--font-display); font-size:1.3rem; font-weight:700; letter-spacing:-.03em; margin-top:4px; }
.metric .m-unit{ font-size:.7rem; color:var(--text-faint); font-weight:600; }
.metric .m-chg{ font-size:.73rem; font-weight:600; margin-top:3px; }
.m-chg.up{ color:var(--good); } .m-chg.down{ color:var(--bad); } .m-chg.flat{ color:var(--text-faint); }
.m-chg.up.inv{ color:var(--bad); } .m-chg.down.inv{ color:var(--good); }
.summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.summary-grid .metric .m-val{ font-size:1.15rem; }

/* =========================================================================
   LISTS
   ========================================================================= */
.list-item{ display:flex; align-items:center; gap:12px; padding:12px 15px; border-bottom:1px solid var(--border); }
.list-item:last-child{ border-bottom:none; }
.list-item .li-ic{ font-size:1.2rem; width:28px; text-align:center; flex:none; }
.list-item .li-main{ flex:1; min-width:0; }
.list-item .li-title{ font-weight:600; font-size:.93rem; letter-spacing:-.005em; }
.list-item .li-sub{ font-size:.77rem; color:var(--text-dim); margin-top:1px; }
.list-item .li-actions{ display:flex; gap:6px; flex:none; }
.empty{ text-align:center; color:var(--text-dim); padding:28px 12px; font-size:.88rem; }
.empty .big{ font-size:1.9rem; display:block; margin-bottom:8px; opacity:.55; }
.no-data{ font-size:.81rem; color:var(--text-faint); padding:20px 0; text-align:center; }

/* =========================================================================
   DRINKS
   ========================================================================= */
.cat-tabs{ display:flex; gap:7px; overflow-x:auto; padding:2px 16px 9px; margin:0 -16px; -webkit-overflow-scrolling:touch; }
.cat-tabs::-webkit-scrollbar{ display:none; }
.cat-tab{
  flex:none; padding:8px 14px; border-radius:20px; background:var(--card-2);
  border:1px solid var(--border); font-size:.82rem; font-weight:600; color:var(--text-dim); white-space:nowrap;
  transition:background .18s ease, color .18s ease;
}
.cat-tab.on{ background:var(--accent); border-color:transparent; color:#fff; }
.drink-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.drink-card{
  background:var(--card); border:1px solid var(--border); border-radius:15px; padding:13px; text-align:left;
  display:flex; flex-direction:column; gap:3px; transition:transform .1s ease, border-color .2s ease;
}
.drink-card:active{ transform:scale(.97); border-color:var(--border-strong); }
.drink-card .dk-ic{ font-size:1.45rem; }
.drink-card .dk-nm{ font-family:var(--font-display); font-weight:600; font-size:.9rem; letter-spacing:-.015em; }
.drink-card .dk-stats{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; font-size:.7rem; font-weight:600; }
.dk-h{ color:var(--hydration); } .dk-c{ color:var(--caffeine); } .dk-s{ color:var(--sugar); } .dk-a{ color:var(--alcohol); }
.serv-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
.serv-grid button{
  background:var(--card-2); border:1px solid var(--border); border-radius:12px; padding:9px 4px;
  color:var(--text); font-weight:600; font-size:.83rem; line-height:1.15; transition:background .18s ease;
}
.serv-grid button small{ display:block; font-size:.66rem; color:var(--text-faint); font-weight:500; margin-top:2px; }
.serv-grid button.on{ background:var(--accent); border-color:transparent; color:#fff; }
.serv-grid button.on small{ color:rgba(255,255,255,.82); }

/* =========================================================================
   SCHEDULE STRIP
   ========================================================================= */
.cal-strip{ display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; margin:0 -2px; }
.cal-strip::-webkit-scrollbar{ display:none; }
.cal-day{ flex:none; width:60px; border-radius:13px; padding:9px 4px; text-align:center; background:var(--card); border:1px solid var(--border); }
.cal-day .cd-dow{ font-size:.6rem; color:var(--text-faint); font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
.cal-day .cd-num{ font-family:var(--font-display); font-size:1.02rem; font-weight:600; margin:3px 0; }
.cal-day .cd-w{ font-size:.6rem; font-weight:600; line-height:1.15; min-height:2.3em; display:flex; align-items:center; justify-content:center; }
.cal-day.today{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.sched-list .list-item .li-sub small{ opacity:.8; }
.wk-type-run{ color:var(--accent); } .wk-type-str{ color:var(--caffeine); } .wk-type-rest{ color:var(--text-dim); }

/* =========================================================================
   STRENGTH TABLE

<script>
/* =====================================================================
   DAILY — single-file health tracker
   Storage strategy:
     - Whole app state lives in one in-memory object (STATE).
     - On boot we hydrate it from the best backend available:
         1. window.storage  (Claude artifact persistent storage)
         2. localStorage    (downloaded / self-hosted file)
         3. in-memory only  (last resort; warns the user)
     - Reads are always synchronous from STATE.
     - Writes mutate STATE then persist in the background (debounced).
   This keeps every UI handler simple and sync while still persisting.
   ===================================================================== */

/* ---------- storage backend detection ---------- */
const STORE_KEY = "daily_health_tracker_v1";
let BACKEND = "memory";           // resolved during boot (local cache layer)
let MEM = null;                   // in-memory fallback blob

/* ---------- cloud sync (Google Sheets via Apps Script web app) ----------
   Canonical store when configured; the local backend above is the offline
   cache. Configure either by hard-coding below, or via Settings → Cloud sync
   (saved on this device only). */
const DEFAULT_SYNC_URL   = "https://script.google.com/macros/s/AKfycbzp83668hb7VfAvyoo8YX2JOj1kpGhoC2URleI6MhiPfKLYBgzXCM26J-wjIIJevG5jag/exec";
const DEFAULT_SYNC_TOKEN = "";    // optional shared secret; must match the Apps Script
const SYNC_CFG_KEY = "daily_sync_cfg_v1";
let SYNC = { state:"disabled", lastSync:null, error:null };  // for the UI

async function backendGet(){
  if (BACKEND === "window") {
    try { const r = await window.storage.get(STORE_KEY); return r ? r.value : null; }
    catch(e){ return null; }
  }
  if (BACKEND === "local") {
    try { return localStorage.getItem(STORE_KEY); } catch(e){ return null; }
  }
  return MEM;
}
async function backendSet(val){
  if (BACKEND === "window") {
    try { await window.storage.set(STORE_KEY, val, false); return true; }
    catch(e){ return false; }
  }
  if (BACKEND === "local") {
    try { localStorage.setItem(STORE_KEY, val); return true; } catch(e){ return false; }
  }
  MEM = val; return true;
}
async function resolveBackend(){
  // Prefer artifact persistent storage if present
  if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") {
    BACKEND = "window"; return;
  }
  // Else try localStorage (works in a downloaded/hosted file)
  try {
    const k = "__daily_probe__";
    localStorage.setItem(k, "1"); localStorage.removeItem(k);
    BACKEND = "local"; return;
  } catch(e){ /* fall through */ }
  BACKEND = "memory";
}

/* ---------- cloud sync helpers ---------- */
function getSyncCfg(){
  let cfg = null;
  try { const raw = localStorage.getItem(SYNC_CFG_KEY); if (raw) cfg = JSON.parse(raw); } catch(e){}
  return {
    url:   (cfg && cfg.url   != null) ? cfg.url   : DEFAULT_SYNC_URL,
    token: (cfg && cfg.token != null) ? cfg.token : DEFAULT_SYNC_TOKEN
  };
}
function setSyncCfg(url, token){
  try { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify({ url:url||"", token:token||"" })); return true; }
  catch(e){ return false; }
}
function syncUrl(){ return (getSyncCfg().url || "").trim(); }
function syncToken(){ return (getSyncCfg().token || "").trim(); }
function remoteEnabled(){ return !!syncUrl(); }

/* GET the whole-state blob from the sheet. Throws on network/parse/error. */
async function remoteLoad(){
  const url = syncUrl(); if (!url) throw new Error("No sync URL");
  const sep = url.includes("?") ? "&" : "?";
  const full = url + sep + "token=" + encodeURIComponent(syncToken()) + "&t=" + Date.now();
  const ctl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  const tm = ctl ? setTimeout(()=>ctl.abort(), 9000) : null;
  let res;
  try { res = await fetch(full, ctl ? { signal: ctl.signal } : {}); }
  finally { if (tm) clearTimeout(tm); }
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  const data = text && text.trim() ? JSON.parse(text) : {};
  if (data && data.error) throw new Error(String(data.error));
  return data;
}
/* POST the whole-state blob to the sheet (last-write-wins). */
async function remoteSave(stateObj){
  const url = syncUrl(); if (!url) throw new Error("No sync URL");
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },  // simple request: no CORS preflight
    body: JSON.stringify({ token: syncToken(), state: stateObj })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  let out = {};
  try { out = JSON.parse(await res.text()); } catch(e){}
  if (out && out.ok === false) throw new Error(out.error || "Save rejected");
  return out;
}

/* A state with no logged data at all (used to avoid a first-sync wipe). */
function isEmptyState(s){
  if (!s) return true;
  const arrs = ["workoutLogs","strengthLogs","hydrationLogs","nutritionLogs","bodyCompositionLogs","brushingLogs","foodLogs","meals","groomingLogs"];
  return arrs.every(k => !Array.isArray(s[k]) || s[k].length === 0);
}

function setSyncState(state, error){
  SYNC.state = state;
  if (error !== undefined) SYNC.error = error;
  if (state === "ok") { SYNC.lastSync = Date.now(); SYNC.error = null; }
  // refresh the sync card if the settings screen is open
  try { if (typeof CURRENT!=="undefined" && CURRENT==="settings" && typeof renderSyncCard==="function") renderSyncCard(); } catch(e){}

    workoutLogs: [],         // run + strength session records (one per logged workout)
    strengthLogs: [],        // detailed strength sets, linked by workoutLogId
    hydrationLogs: [],       // individual drink entries
    nutritionLogs: [],       // one per day
    bodyCompositionLogs: [], // one per day
    brushingLogs: [],        // one per day-slot
    foodLogs: [],            // itemised food entries (barcode / manual), many per day

    groomingLogs: [],        // shaves and haircuts (one entry per occurrence)
    drinkDatabase: defaultDrinks()
  };
}

let STATE = defaultState();

/* ---------- persistence ---------- */
let saveTimer = null, remoteTimer = null;
async function saveLocal(){ return backendSet(JSON.stringify(STATE)); }

function persist(){
  // local cache: fast, keeps offline + instant next load
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const ok = await saveLocal();
    if (!ok) console.warn("Local persist failed");
  }, 250);
  // remote: debounced a touch longer to batch rapid edits
  if (remoteEnabled()){
    clearTimeout(remoteTimer);
    remoteTimer = setTimeout(async () => {
      setSyncState("saving");
      try { await remoteSave(STATE); setSyncState("ok"); }
      catch(e){ setSyncState("error", e.message || String(e)); console.warn("Remote save failed", e); }
    }, 700);
  }
}
function save(){ STATE.updatedAt = Date.now(); persist(); }

async function loadLocal(){
  const raw = await backendGet();
  if (!raw) return null;
  try { return JSON.parse(raw); } catch(e){ console.warn("Bad local data", e); return null; }
}

async function loadState(){
  await resolveBackend();
  // 1) hydrate from the local cache first (instant, works offline)
  const local = await loadLocal();
  STATE = local ? mergeDefaults(local) : defaultState();

  // 2) reconcile with the cloud if configured
  if (!remoteEnabled()){ SYNC.state = "disabled"; return; }
  setSyncState("loading");
  try {
    const remoteRaw = await remoteLoad();
    const remote = (remoteRaw && Object.keys(remoteRaw).length) ? mergeDefaults(remoteRaw) : null;
    const rEmpty = isEmptyState(remote), lEmpty = isEmptyState(STATE);
    if (remote && !rEmpty && (lEmpty || (remote.updatedAt||0) >= (STATE.updatedAt||0))){
      STATE = remote;            // cloud is newer/authoritative
      await saveLocal();         // refresh the local cache
    } else if (!lEmpty){
      await remoteSave(STATE);    // local is newer or seeding a fresh sheet -> push up
    }
    setSyncState("ok");
  } catch(e){
    setSyncState("error", e.message || String(e));   // stay on the local copy
    console.warn("Cloud load failed; working offline", e);
  }
}
/* Make sure newly added fields exist even on old saves. */
function mergeDefaults(s){
  const d = defaultState();
  s.settings = Object.assign({}, d.settings, s.settings||{});
  s.settings.nutritionTargets = Object.assign({}, d.settings.nutritionTargets, (s.settings.nutritionTargets)||{});
  s.settings.units = Object.assign({}, d.settings.units, (s.settings.units)||{});
  s.settings.groomingIntervals = Object.assign({}, d.settings.groomingIntervals, (s.settings.groomingIntervals)||{});
  ["workoutLogs","strengthLogs","hydrationLogs","nutritionLogs","bodyCompositionLogs","brushingLogs","foodLogs","meals","groomingLogs","drinkDatabase"]
    .forEach(k => { if(!Array.isArray(s[k])) s[k] = d[k]; });
  if (!s.drinkDatabase.length) s.drinkDatabase = d.drinkDatabase;
  s.version = 1;
  return s;
}

/* ---------- small utilities ---------- */
function uid(p="id"){ return p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7); }
function todayISO(){ return toISO(new Date()); }
function toISO(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function fromISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(iso,n){ const d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function dayDiff(a,b){ return Math.round((fromISO(a)-fromISO(b))/86400000); }
function dow(iso){ return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][fromISO(iso).getDay()]; }
function dnum(iso){ return fromISO(iso).getDate(); }
function prettyDate(iso){
  const d=fromISO(iso), t=todayISO();
  if(iso===t) return "Today";
  if(iso===addDays(t,-1)) return "Yesterday";
  if(iso===addDays(t,1)) return "Tomorrow";
  return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
function num(v,dflt=0){ const n=parseFloat(v); return isFinite(n)?n:dflt; }
function round(n,dp=1){ const f=Math.pow(10,dp); return Math.round(n*f)/f; }
function fmt(n,dp=1){ if(n==null||!isFinite(n)) return "–"; return round(n,dp).toLocaleString("en-GB"); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
/* fmt() is for display (it groups thousands); number inputs need a bare
   numeric string or the browser discards the value. */
function numVal(n,dp=1){ if(n==null||!isFinite(n)) return ""; return String(round(n,dp)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function byDateDesc(a,b){ return a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0); }
function $(sel,root=document){ return root.querySelector(sel); }
function $$(sel,root=document){ return Array.from(root.querySelectorAll(sel)); }

let toastTimer=null;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1900);
}

/* mm:ss formatter for timers/durations */
function mmss(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }

/* =====================================================================
   WORKOUT SCHEDULER (deterministic, run-first)
   ---------------------------------------------------------------------
   The ideal rolling 7-day week is: 1 Long, 1 Medium, 1 Short run +
   2-3 strength sessions + at least 1 rest day. Running is the priority;
   strength fits into the gaps. The schedule is rebuilt purely from
   workout history, so the same history always yields the same plan.

   Internal normalised types: Long, Medium, Short, Legs, Upper1, Upper2,
   Rest, null(empty). Short Run 1 / Short Run 2 are *scheduling labels*
   only — both normalise to Short and both log as "Short Run".
   ===================================================================== */

const STRENGTH_TYPES = ["Legs","Upper 1","Upper 2"];
const ALL_WORKOUT_TYPES = ["Long Run","Medium Run","Short Run 1","Short Run 2","Legs","Upper 1","Upper 2","Rest Day","Missed Workout"];

function norm(t){
  switch(t){
    case "Long Run": return "Long";
    case "Medium Run": return "Medium";
    case "Short Run": case "Short Run 1": case "Short Run 2": return "Short";
    case "Legs": return "Legs";
    case "Upper 1": return "Upper1";
    case "Upper 2": return "Upper2";
    case "Rest Day": return "Rest";
    default: return null;
  }
}
function isRunNorm(n){ return n==="Long"||n==="Medium"||n==="Short"; }
function isStrengthNorm(n){ return n==="Legs"||n==="Upper1"||n==="Upper2"; }

/* What a log actually means for scheduling. Missed -> empty (didn't happen). */
function effectiveNorm(log){
  if (log.status === "Missed") return null;
  if (log.status === "Rest Day") return "Rest";
  return norm(log.actual || log.scheduled);
}

/* Category label stored against a completed workout (shorts collapse). */
function categoryLabel(type){
  const n = norm(type);
  if (n==="Long") return "Long Run";
  if (n==="Medium") return "Medium Run";
  if (n==="Short") return "Short Run";
  if (n==="Legs") return "Legs";
  if (n==="Upper1") return "Upper 1";
  if (n==="Upper2") return "Upper 2";
  if (n==="Rest") return "Rest Day";
  return "Missed Workout";
}

/* Build {iso: normalisedType} from history (completed/rest/etc.). */
function buildTimeline(){
  const tl = {};
  for (const log of STATE.workoutLogs){
    const n = effectiveNorm(log);
    if (n !== null) tl[log.date] = n;          // missed stays absent
  }
  return tl;
}

/* ---- window helpers operating on a timeline map ---- */
function lookback(tl, d, span){       // returns array of norms for the `span` days BEFORE d
  const out=[];
  for (let i=1;i<=span;i++){ out.push(tl[addDays(d,-i)] || null); }
  return out;                          // index 0 = yesterday
}
function lastDateOf(tl, before, pred){
  for (let i=1;i<=120;i++){ const dd=addDays(before,-i); if (tl[dd]!==undefined && pred(tl[dd])) return dd; }
  return null;
}

/* Decide the workout for a single future day `d`, given timeline so far. */
function decideDay(tl, d){
  const prev = tl[addDays(d,-1)] || null;            // yesterday
  const w6   = lookback(tl, d, 6);                    // last 6 days
  const runsPrev6 = w6.filter(isRunNorm).length;
  const restPrev6 = w6.filter(n=>n==="Rest").length;
  const activityPrev6 = w6.filter(n=>n!==null).length;
  const hasLong   = w6.includes("Long");
  const hasMedium = w6.includes("Medium");
  const hasShort  = w6.includes("Short");

  const lastLongDate = lastDateOf(tl, d, n=>n==="Long");
  const lastRunDate  = lastDateOf(tl, d, isRunNorm);
  const lastRunKind  = lastRunDate ? tl[lastRunDate] : null;
  // after a Long Run, the next run must be a Short until a Short happens
  let mustShortAfterLong = false;
  if (lastLongDate){
    const shortAfter = lastDateOf(tl, d, n=>n==="Short");
    mustShortAfterLong = !shortAfter || shortAfter < lastLongDate;
    // only applies if the most recent run was that Long (no other run since)
    if (lastRunKind !== "Long") mustShortAfterLong = false;
  }
  // two-calendar-day recovery window after a Long Run (no Long/Medium/Legs)
  const inLongWindow = (lastLongDate && (dayDiff(d,lastLongDate) <= 2));

  // ---- RULE: at least one rest in every rolling 7-day period ----
  // If the 6 prior days hold training but no rest, today must be a rest.
  if (restPrev6 === 0 && activityPrev6 > 0) return "Rest";

  const runAllowed = !isRunNorm(prev);   // never two runs in a row

  // ---- run validity by kind ----
  const longValid   = runAllowed && !hasLong && !inLongWindow && !mustShortAfterLong;
  const mediumValid = runAllowed && !inLongWindow && !mustShortAfterLong;
  const shortValid  = runAllowed;

  // ---- STEP 1: keep three runs per rolling 7-day window ----
  if (runsPrev6 < 3){
    if (mustShortAfterLong && shortValid) return pickShort(tl, d);
    if (!hasLong && longValid) return "Long";
    if (!hasMedium && mediumValid) return "Medium";
    if (!hasShort && shortValid) return pickShort(tl, d);
    // all three kinds present but <3 total (rare) -> add a short for flexibility
    if (shortValid) return pickShort(tl, d);
  }

  // ---- STEP 2: fit strength around the runs (least-recently-done first) ----
  const strengthChoice = pickStrength(tl, d, prev, inLongWindow);
  if (strengthChoice) return strengthChoice;

  // ---- STEP 3: nothing valid -> rest ----
  return "Rest";
}

/* Choose Short Run 1 vs Short Run 2 by which variant was scheduled least recently. */
function pickShort(tl, d){
  // tl stores "Short" for both; we track variant separately on the schedule object,
  // so here we just return the normalised "Short" and let the caller assign a label.
  return "Short";
}

/* Pick the least-recently-done valid strength workout. */
function pickStrength(tl, d, prev, inLongWindow){
  const candidates = [];
  // Legs: not after Long/Medium, not in 2-day post-long window, not after Legs
  const legsValid = prev!=="Long" && prev!=="Medium" && prev!=="Legs" && !inLongWindow;
  // Upper: not the day after any upper session
  const upperBlocked = (prev==="Upper1" || prev==="Upper2");
  if (legsValid) candidates.push("Legs");
  if (!upperBlocked) { candidates.push("Upper1"); candidates.push("Upper2"); }
  if (!candidates.length) return null;

  // least recently done wins; never-done counts as oldest. Fixed order breaks ties.
  const order = { "Legs":0, "Upper1":1, "Upper2":2 };
  let best=null, bestKey=Infinity;
  for (const c of candidates){
    const last = lastDateOf(tl, d, n=>n===c);
    const ageKey = last ? dayDiff(d,last) : 9999;     // bigger = staler
    // primary: staler first (so use negative age for min-search), secondary: fixed order
    const key = (-ageKey)*10 + order[c];
    if (key < bestKey){ bestKey=key; best=c; }
  }
  return best;
}

/* Map an internal normal -> a schedulable display type, choosing SR variant. */
function toScheduledType(tl, d, n, shortVariantState){
  if (n==="Long") return "Long Run";
  if (n==="Medium") return "Medium Run";
  if (n==="Short"){
    // alternate SR1 / SR2 by which was scheduled least recently
    const last1 = shortVariantState.lastSR1, last2 = shortVariantState.lastSR2;
    let variant;
    if (!last1 && !last2) variant = "Short Run 1";
    else if (!last1) variant = "Short Run 1";
    else if (!last2) variant = "Short Run 2";
    else variant = (last1 <= last2) ? "Short Run 1" : "Short Run 2";
    if (variant==="Short Run 1") shortVariantState.lastSR1 = d; else shortVariantState.lastSR2 = d;
    return variant;
  }
  if (n==="Legs") return "Legs";
  if (n==="Upper1") return "Upper 1";
  if (n==="Upper2") return "Upper 2";
  return "Rest Day";
}

/* Generate the rolling 28-day schedule starting today. Logged days are shown
   as-is and fed into the timeline; unlogged days get a fresh suggestion. */
function generateSchedule(days=28){
  const tl = buildTimeline();
  const start = todayISO();
  const logByDate = {}; STATE.workoutLogs.forEach(l => { logByDate[l.date] = l; });

  // seed short-variant alternation from history
  const sv = { lastSR1:null, lastSR2:null };
  STATE.workoutLogs.forEach(l=>{
    if (l.scheduled==="Short Run 1") sv.lastSR1 = l.date;
    if (l.scheduled==="Short Run 2") sv.lastSR2 = l.date;
  });

  const out=[];
  for (let i=0;i<days;i++){
    const d = addDays(start, i);
    if (logByDate[d]){
      const log = logByDate[d];
      out.push({ date:d, logged:true, log,
                 scheduledType: log.scheduled || categoryLabel(log.actual),
                 status: log.status });
    } else {
      const n = decideDay(tl, d);
      const schedType = toScheduledType(tl, d, n, sv);
      tl[d] = n;                       // commit so later days see it
      out.push({ date:d, logged:false, scheduledType: schedType, status:"Scheduled" });
    }
  }
  return out;
}

/* Catch-up: any past day (from the first workout log up to yesterday) with no
   log gets auto-filled. A scheduled Rest day is logged as a completed Rest
   (counts as done); anything else is logged as Missed. Runs on boot so the
   moment a day ends without a workout, it lands as "not done" on next open. */
function backfillMissedWorkouts(){
  const logs = STATE.workoutLogs;
  if (!logs.length) return false;                 // schedule hasn't started yet
  let anchor = logs[0].date;
  for (const l of logs) if (l.date < anchor) anchor = l.date;
  const today = todayISO();
  if (anchor >= today) return false;

  const have = {}; logs.forEach(l => { have[l.date] = true; });
  const tl = buildTimeline();                     // live timeline we extend as we go
  const sv = { lastSR1:null, lastSR2:null };
  logs.forEach(l => {
    if (l.scheduled==="Short Run 1") sv.lastSR1 = l.date;
    if (l.scheduled==="Short Run 2") sv.lastSR2 = l.date;
  });

  let changed = false;
  for (let d = anchor; d < today; d = addDays(d,1)){
    if (have[d]) continue;
    const n = decideDay(tl, d);
    if (n === "Rest"){
      STATE.workoutLogs.push({ id:uid("wk"), date:d, createdAt:Date.now(),
        scheduled:"Rest Day", actual:null, category:"Rest Day", status:"Rest Day", auto:true });
      tl[d] = "Rest";                             // a rest counts in the timeline
    } else {
      STATE.workoutLogs.push({ id:uid("wk"), date:d, createdAt:Date.now(),
        scheduled: toScheduledType(tl, d, n, sv), actual:null,
        category:"Missed Workout", status:"Missed", auto:true });
      // a miss "didn't happen" -> deliberately left absent from the timeline
    }
    have[d] = true;
    changed = true;
  }
  return changed;
}

/* ---- run progression / targets ---- */
function completedRuns(kindNorm){
  return STATE.workoutLogs
    .filter(l => (l.status==="Completed"||l.status==="Unscheduled") && norm(l.actual)===kindNorm)
    .sort(byDateDesc);
}
function mostRecentLong(){ return completedRuns("Long")[0] || null; }

function nextLongTargets(){
  const last = mostRecentLong();
  if (!last){
    return { run: STATE.settings.firstLongRunRun, walk: STATE.settings.firstLongRunWalk, first:true };
  }
  const prevRun  = num(last.actualRun, last.targetRun || STATE.settings.firstLongRunRun);
  const prevWalk = num(last.actualWalk, last.targetWalk || STATE.settings.firstLongRunWalk);
  const newRun = prevRun * 1.1;
  const newWalk = ((prevWalk / prevRun) * newRun) / 0.85;
  return { run: round(newRun,2), walk: round(newWalk,2), first:false };
}
function mediumTarget(){ const l=mostRecentLong(); return l ? round(num(l.actualDistance)*0.5,2) : null; }
function shortTarget(){ const l=mostRecentLong(); return l ? round(num(l.actualDistance)*0.25,2) : null; }

      ? (todayPlan.status==="Rest Day"?"Rest":(todayPlan.status==="Missed"?"Missed":"Done"))
      : shortLabel(todayPlan.scheduledType);
  // nutrition
  const nut = getNutrition(t);
  // body
  const bc = STATE.bodyCompositionLogs.slice().sort(byDateDesc)[0];
  // teeth
  const bm = getBrushing(t,"morning"), be = getBrushing(t,"evening");
  const brushDots = (bm&&bm.done?"●":"○")+(be&&be.done?"●":"○");
  const teethPct = (bm&&bm.done?50:0) + (be&&be.done?50:0);
  const movePct = todayPlan.logged ? (todayPlan.status==="Missed" ? 0 : 100) : 0;
  const moveVal = todayPlan.logged
    ? (todayPlan.status==="Rest Day" ? "Rest" : todayPlan.status==="Missed" ? "Miss" : "Done")
    : shortLabel(todayPlan.scheduledType);

  return {
    hydrationPct,
    hydrationMeta: `${fmt(hy.effective,0)} / ${STATE.settings.hydrationGoalMl} ml`,
    todayWorkoutShort,
    workoutMeta: todayPlan.logged ? "Logged today" : ("Today: "+shortLabel(todayPlan.scheduledType)),
    nutritionMeta: (nut || drinkSugarKcal(t)>0) ? `${fmt(totalCaloriesFor(t),0)} kcal today` : "Not logged today",
    bodyMeta: bc ? `${fmt(bc.weight,1)} kg · ${prettyDate(bc.date)}` : "No entries yet",
    teethMeta: `${(bm&&bm.done)?"✓":"–"} AM · ${(be&&be.done)?"✓":"–"} PM`,
    groomMeta: groomHomeMeta(),
    teethPct, movePct, moveVal,
    brushDots
  };
}
function shortLabel(type){
  return type.replace("Short Run 1","Short").replace("Short Run 2","Short")
             .replace("Long Run","Long").replace("Medium Run","Medium")
             .replace("Rest Day","Rest").replace("Upper 1","Upper 1").replace("Upper 2","Upper 2");
}

/* =====================================================================
   WORKOUTS — dashboard, logging, strength tracker, timer
   ===================================================================== */
function workoutForDate(d){ return STATE.workoutLogs.find(l=>l.date===d) || null; }
function strengthForDate(d){ return STATE.strengthLogs.find(s=>s.date===d) || null; }
function clearWorkout(d){
  STATE.workoutLogs = STATE.workoutLogs.filter(l=>l.date!==d);
  STATE.strengthLogs = STATE.strengthLogs.filter(s=>s.date!==d);
}
function upsertWorkout(d, fields){
  clearWorkout(d);
  const log = Object.assign({ id:uid("wk"), date:d, createdAt:Date.now(), notes:"" }, fields, { updatedAt:Date.now() });
  STATE.workoutLogs.push(log);
  return log;
}
/* suggested/scheduled type for any date (uses a log's scheduled if present) */
function suggestedTypeForDate(d){
  const log = workoutForDate(d);
  if (log && log.scheduled) return log.scheduled;
  const tl = buildTimeline();
  const sv = { lastSR1:null, lastSR2:null };
  STATE.workoutLogs.forEach(l=>{ if(l.scheduled==="Short Run 1")sv.lastSR1=l.date; if(l.scheduled==="Short Run 2")sv.lastSR2=l.date; });
  const n = decideDay(tl, d);
  return toScheduledType(tl, d, n, sv);
}

/* stopwatches (strength + teeth share this) */
const SW = {};
function swEnsure(n){ if(!SW[n]) SW[n]={sec:0,running:false,_i:null}; return SW[n]; }
function swToggle(name, dispId, btnId){
  const sw=swEnsure(name);
  if (sw.running){ clearInterval(sw._i); sw.running=false; }
  else { sw.running=true; sw._i=setInterval(()=>{ sw.sec++; const el=document.getElementById(dispId); if(el)el.textContent=mmss(sw.sec); }, 1000); }
  const b=document.getElementById(btnId); if(b) b.textContent = sw.running?"⏸ Pause":"▶ Start";
}
function swReset(name, dispId, btnId){ const sw=swEnsure(name); clearInterval(sw._i); sw.sec=0; sw.running=false;
  const el=document.getElementById(dispId); if(el)el.textContent=mmss(0); const b=document.getElementById(btnId); if(b)b.textContent="▶ Start"; }
function swSet(name,sec){ const sw=swEnsure(name); clearInterval(sw._i); sw.running=false; sw.sec=sec; }
function timerWidget(name, label){
  const sw=swEnsure(name); const disp="swdisp_"+name, btn="swbtn_"+name;
  return `<div class="timer">
    <div class="tdisp" id="${disp}">${mmss(sw.sec)}</div>
    <button class="btn sm" id="${btn}" onclick="swToggle('${name}','${disp}','${btn}')">${sw.running?"⏸ Pause":"▶ Start"}</button>
    <button class="btn sm ghost" onclick="swReset('${name}','${disp}','${btn}')">Reset</button>
  </div>`;
}

/* ---- actions ---- */
function undoWorkout(d){ clearWorkout(d); save(); toast("Cleared"); navigate("workouts"); }
function markRest(d){ upsertWorkout(d,{scheduled:suggestedTypeForDate(d),actual:null,category:"Rest Day",status:"Rest Day"}); save(); toast("Rest day logged"); navigate("workouts"); }
function markMissed(d){ upsertWorkout(d,{scheduled:suggestedTypeForDate(d),actual:null,category:"Missed Workout",status:"Missed"}); save(); toast("Marked missed"); navigate("workouts"); }

function startComplete(d, scheduledType){
  const n = norm(scheduledType);
  if (isRunNorm(n)) openRunSheet(d, scheduledType, false);
  else if (isStrengthNorm(n)) openStrengthSheet(d, scheduledType, false);
  else markRest(d);

function chooseWorkout(d, unscheduled){
  const opts = [
    ["Long Run","🏃"],["Medium Run","🏃"],["Short Run","🏃"],
    ["Legs","🏋️"],["Upper 1","🏋️"],["Upper 2","🏋️"],

  ];

    <div class="grid2">${opts.map(([t,ic])=>`

function pickWorkout(d, type, unscheduled){
  closeSheet();

  if (type==="Missed Workout") return markMissed(d);
  if (isRunNorm(n)) return openRunSheet(d, type, unscheduled);

}

  const existing = workoutForDate(d);
  let body = `<h3>${type.replace(/ 1| 2/,"")} — ${prettyDate(d)}</h3>`;

        <label class="field"><span>Actual walk interval (min)</span><input class="input" id="r_walk" type="number" step="0.1" value="${existing&&existing.actualWalk!=null?existing.actualWalk:fmt(lt.walk)}"></label>

      : `<div class="warnbox">Complete a Long Run first to set a target distance.</div>`;
    body += `<label class="field"><span>Actual distance (${u})</span><input class="input" id="r_dist" type="number" step="0.01" value="${existing&&existing.actualDistance!=null?existing.actualDistance:""}" placeholder="distance covered"></label>`;
  }
  body += `<label class="field"><span>Notes (optional)</span><textarea class="input" id="r_notes" placeholder="How did it feel?">${existing?esc(existing.notes||""):""}</textarea></label>
    <button class="btn primary full" onclick="saveRun('${d}','${type}',${unscheduled})">Save run</button>`;

function saveRun(d, type, unscheduled){
  const n=norm(type);
  const lt = nextLongTargets();
  const f = { scheduled: suggestedTypeForDate(d), actual: categoryLabel(type), category: categoryLabel(type),
              status: unscheduled?"Unscheduled":"Completed",
              actualDistance: num($("#r_dist")?.value, null),
              notes: ($("#r_notes")?.value||"").trim() };
  if (n==="Long"){
    f.targetRun=lt.run; f.targetWalk=lt.walk;
    f.actualRun=num($("#r_run").value, lt.run); f.actualWalk=num($("#r_walk").value, lt.walk);
  } else { f.targetDistance = n==="Medium"?mediumTarget():shortTarget(); }
  // a logged run counts as "Completed" if it matches the day's suggestion, else stays as chosen status
  upsertWorkout(d, f); save(); closeSheet(); toast("Run logged"); navigate("workouts");
}

/* ---- strength logging sheet ---- */
let EDIT_STR = null;
function prevSetsFor(name, beforeDate){
  const key=name.trim().toLowerCase(); if(!key) return null;
  const cands = STATE.strengthLogs.filter(s=>s.date<beforeDate).sort(byDateDesc);
  for (const s of cands){ const ex=(s.exercises||[]).find(e=>e.name.trim().toLowerCase()===key); if(ex) return ex.sets; }
  return null;
}
function openStrengthSheet(d, type, unscheduled){
  const existing = strengthForDate(d);
  if (existing && norm(workoutForDate(d)?.actual)===norm(type)){
    EDIT_STR = JSON.parse(JSON.stringify({ date:d, type, unscheduled, exercises:existing.exercises, notes:existing.notes||"" }));
  } else {
    EDIT_STR = { date:d, type, unscheduled, exercises:[{name:"",sets:[{kg:"",reps:"",done:false}]}], notes:"" };
    swReset("strength","swdisp_strength","swbtn_strength");
  }
  renderStrengthSheet();
}
function renderStrengthSheet(){
  const e=EDIT_STR;
  const exHtml = e.exercises.map((ex,xi)=>{
    const prev = prevSetsFor(ex.name, e.date);
    const rows = ex.sets.map((set,si)=>{
      const p = prev&&prev[si] ? `${fmt(prev[si].kg)}×${fmt(prev[si].reps)}` : "–";
      return `<tr>
        <td class="setn">${si+1}</td>
        <td class="prev">${p}</td>
        <td><input type="number" step="0.5" inputmode="decimal" value="${esc(set.kg)}" onchange="strSet(${xi},${si},'kg',this.value)"></td>
        <td><input type="number" step="1" inputmode="numeric" value="${esc(set.reps)}" onchange="strSet(${xi},${si},'reps',this.value)"></td>
        <td class="donecell"><button class="setdone ${set.done?"on":""}" onclick="strSet(${xi},${si},'done',${!set.done})">${set.done?"✓":""}</button></td>
        <td><button class="del-set" onclick="strDelSet(${xi},${si})">×</button></td>
      </tr>`;
    }).join("");
    return `<div class="ex-block">
      <div class="ex-head">
        <input placeholder="Exercise name" value="${esc(ex.name)}" onchange="strName(${xi},this.value)">
        <button class="iconbtn" title="Duplicate" onclick="strDupEx(${xi})">⧉</button>
        <button class="iconbtn" title="Remove" onclick="strDelEx(${xi})">🗑️</button>
      </div>
      <table class="set-table"><thead><tr>
        <th>Set</th><th>Prev</th><th>kg</th><th>reps</th><th>✓</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table>
      <button class="btn tiny ghost" style="margin-top:8px" onclick="strAddSet(${xi})">＋ Add set</button>
    </div>`;
  }).join("");
  openSheet(`<h3>${e.type} — ${prettyDate(e.date)}</h3>
    ${timerWidget("strength","Workout timer")}
    <div style="height:12px"></div>
    ${exHtml}
    <div class="btn-row">
      <button class="btn sm" onclick="strAddEx()">＋ Add exercise</button>
    </div>
    <label class="field" style="margin-top:14px"><span>Session notes</span><textarea class="input" id="str_notes" placeholder="Optional" onchange="EDIT_STR.notes=this.value">${esc(e.notes)}</textarea></label>
    <button class="btn primary full" onclick="saveStrength()">Save workout</button>`);
}
function strSet(xi,si,key,val){ if(key==="done")EDIT_STR.exercises[xi].sets[si].done=val; else EDIT_STR.exercises[xi].sets[si][key]=val; if(key==="done")renderStrengthSheet(); }
function strName(xi,val){ EDIT_STR.exercises[xi].name=val; renderStrengthSheet(); }
function strAddSet(xi){ const sets=EDIT_STR.exercises[xi].sets; const last=sets[sets.length-1]||{kg:"",reps:""}; sets.push({kg:last.kg,reps:last.reps,done:false}); renderStrengthSheet(); }
function strDelSet(xi,si){ EDIT_STR.exercises[xi].sets.splice(si,1); if(!EDIT_STR.exercises[xi].sets.length)EDIT_STR.exercises[xi].sets.push({kg:"",reps:"",done:false}); renderStrengthSheet(); }
function strAddEx(){ EDIT_STR.exercises.push({name:"",sets:[{kg:"",reps:"",done:false}]}); renderStrengthSheet(); }
function strDelEx(xi){ EDIT_STR.exercises.splice(xi,1); if(!EDIT_STR.exercises.length)EDIT_STR.exercises.push({name:"",sets:[{kg:"",reps:"",done:false}]}); renderStrengthSheet(); }
function strDupEx(xi){ EDIT_STR.exercises.splice(xi+1,0,JSON.parse(JSON.stringify(EDIT_STR.exercises[xi]))); renderStrengthSheet(); }
function saveStrength(){
  const e=EDIT_STR;
  const exercises = e.exercises
    .map(ex=>({ name:ex.name.trim(), sets:ex.sets.map(s=>({kg:num(s.kg,null),reps:num(s.reps,null),done:!!s.done})) }))
    .filter(ex=>ex.name);
  const dur = swEnsure("strength").sec;
  upsertWorkout(e.date,{ scheduled:suggestedTypeForDate(e.date), actual:e.type, category:categoryLabel(e.type),
    status: e.unscheduled?"Unscheduled":"Completed", durationSec:dur, notes:e.notes });
  const wk = workoutForDate(e.date);
  STATE.strengthLogs.push({ id:uid("str"), date:e.date, workoutLogId:wk.id, workoutType:e.type, exercises, notes:e.notes, durationSec:dur, createdAt:Date.now() });
  swReset("strength","swdisp_strength","swbtn_strength");
  save(); closeSheet(); toast("Workout saved"); navigate("workouts");
}

/* Common serving presets (ml). "Default" uses each drink's own size. */
const SERVINGS = [
  { nm:"Small", ml:150 }, { nm:"Cup", ml:200 }, { nm:"Glass", ml:250 },
  { nm:"Mug", ml:300 }, { nm:"Can", ml:330 }, { nm:"Bottle", ml:500 },
  { nm:"Pint", ml:568 }, { nm:"Shot", ml:30 }
];
const DRINK_CATEGORIES = [
  "Water","Coffee","Tea & cocoa","Juices","Soda",
  "Sport & wellness","Milk & alternatives","Alcohol","Soups / hidden drinks","Other"
];

/* UK alcohol units = ml × ABV% / 1000 */
function alcoholUnitsFor(ml, abvPct){ return (num(ml) * num(abvPct)) / 1000; }

/* Build a hydration log entry from a drink + actual ml (scales caffeine/sugar/alcohol). */
function makeHydrationEntry(drink, ml, date){
  const scale = drink.defaultMl ? (ml / drink.defaultMl) : 1;
  return {
    id: uid("hyd"), date, source:"hydration", createdAt: Date.now(), updatedAt: Date.now(),
    drinkId: drink.id, name: drink.name, category: drink.category, icon: drink.icon,
    ml: round(ml,0), hydrationPct: drink.hydrationPct,
    caffeineMg: round(num(drink.caffeine) * scale, 1),
    sugarG: round(num(drink.sugar) * scale, 1),
    alcoholPct: num(drink.alcoholPct),
    alcoholUnits: round(alcoholUnitsFor(ml, drink.alcoholPct), 2)
  };
}

/* Daily hydration roll-up (referenced by home + trends). */
function hydrationSummary(date){
  const logs = STATE.hydrationLogs.filter(l => l.date === date);
  let fluid=0, effective=0, caffeine=0, sugar=0, alcoholUnits=0;
  logs.forEach(l => {
    fluid       += num(l.ml);
    effective   += num(l.ml) * num(l.hydrationPct) / 100;
    caffeine    += num(l.caffeineMg);
    sugar       += num(l.sugarG);
    alcoholUnits+= num(l.alcoholUnits);
  });
  const goal = STATE.settings.hydrationGoalMl;
  return {
    logs: logs.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)),
    fluid, effective, caffeine, sugar, alcoholUnits, goal,
    pct: goal ? (effective/goal*100) : 0,
    met: effective >= goal
  };
}

function setWaterFill(pct){

}

/* =====================================================================
   SECTION 3 — NUTRITION  (one manual total per day)
   ===================================================================== */
const NUTRIENTS = [
  { key:"calories", lab:"Calories",      unit:"kcal", limit:true  },
  { key:"protein",  lab:"Protein",       unit:"g",    limit:false },
  { key:"carbs",    lab:"Carbs",         unit:"g",    limit:true  },
  { key:"fat",      lab:"Fat",           unit:"g",    limit:true  },
  { key:"satFat",   lab:"Saturated fat", unit:"g",    limit:true  },
  { key:"sugar",    lab:"Sugar",         unit:"g",    limit:true  },
  { key:"fibre",    lab:"Fibre",         unit:"g",    limit:false },
  { key:"salt",     lab:"Salt",          unit:"g",    limit:true  }
];

function getNutrition(date){ return STATE.nutritionLogs.find(l => l.date === date) || null; }

/* Sugar is a carbohydrate: ~4 kcal per gram. Drinks logged in Hydration carry
   their sugar, so those calories are folded into the day's calorie total. */
const SUGAR_KCAL_PER_G = 4;
function drinkSugarKcal(date){ return round(hydrationSummary(date).sugar * SUGAR_KCAL_PER_G, 0); }

/* ---- targets ----------------------------------------------------------
   The protein target can track body weight (2 g per kg by default), so every
   read goes through nutritionTarget() rather than the stored figure. */
function latestBodyWeightKg(){
  const withWeight = bodyLogsSorted().filter(l => l.weight!=null && l.weight!=="");
  const last = withWeight[withWeight.length-1];
  return last ? num(last.weight) : null;
}
function nutritionTarget(key){
  const s = STATE.settings;
  if (key==="protein" && s.proteinFromWeight){
    const kg = latestBodyWeightKg();
    if (kg) return Math.round(kg * num(s.proteinPerKg, 2));
  }
  return num(s.nutritionTargets[key], 0);
}
function effectiveTargets(){
  const o = {};
  NUTRIENTS.forEach(n => o[n.key] = nutritionTarget(n.key));
  return o;
}
/* Is the protein figure currently being derived rather than typed in? */
function proteinIsDerived(){ return !!STATE.settings.proteinFromWeight && !!latestBodyWeightKg(); }

/* ---- energy burnt (read off the Apple Watch and typed in) ---- */
function getBurned(date){ const l = getNutrition(date); return l && l.burned!=null ? num(l.burned) : 0; }
function hasBurned(date){ const l = getNutrition(date); return !!(l && l.burned!=null); }
function setBurned(date, kcal){
  let log = getNutrition(date);
  if (!log){ log = { id:uid("nut"), date, source:"nutrition", createdAt:Date.now() }; STATE.nutritionLogs.push(log); }
  log.burned = (kcal===null || kcal==="") ? null : Math.max(0, num(kcal));
  log.updatedAt = Date.now();
  save();
}
function saveBurned(){
  const d = screenDate("nutrition"), el = $("#burnKcal");
  setBurned(d, el ? el.value : "");
  toast("Energy burnt saved"); navigate("nutrition");
}
function clearBurned(){
  const d = screenDate("nutrition");
  setBurned(d, "");
  toast("Cleared"); navigate("nutrition");
}
/* eaten (food + drink sugar + manual) minus burnt */
function netCaloriesFor(date){ return totalCaloriesFor(date) - getBurned(date); }

/* A manual day record only counts as "nutrition logged" if it holds actual
   nutrients — a record carrying just an energy-burnt figure doesn't. */
function manualHasNutrients(log){ return !!log && NUTRIENTS.some(n => log[n.key]!=null); }

/* Itemised food entries logged for a day (barcode or manual), oldest first. */
function foodLogsForDate(date){
  return STATE.foodLogs.filter(f => f.date === date).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}
/* One nutrient's total for a day = optional manual daily figure + every food
   item + (for calories) the calories from drink sugar. */
function dayNutrient(date, key){
  const m = getNutrition(date);
  let v = (m && m[key]!=null) ? num(m[key]) : 0;
  STATE.foodLogs.forEach(f => { if (f.date===date) v += num(f[key]); });
  if (key==="calories") v += drinkSugarKcal(date);
  return v;
}
function totalCaloriesFor(date){ return dayNutrient(date, "calories"); }
function foodKcalFor(date){ let v=0; STATE.foodLogs.forEach(f=>{ if(f.date===date) v+=num(f.calories); }); return v; }
function dayHasNutrition(date){
  return manualHasNutrients(getNutrition(date)) || STATE.foodLogs.some(f=>f.date===date) || drinkSugarKcal(date)>0;
}

function nutritionDatesInWindow(days){
  const cutoff = addDays(todayISO(), -(days-1)), today = todayISO();
  const set = {};
  const within = dt => dt>=cutoff && dt<=today;
  STATE.nutritionLogs.forEach(l => { if (within(l.date) && manualHasNutrients(l)) set[l.date]=1; });
  STATE.foodLogs.forEach(f => { if (within(f.date)) set[f.date]=1; });
  STATE.hydrationLogs.forEach(h => { if (within(h.date) && num(h.sugarG)>0) set[h.date]=1; });
  return Object.keys(set);
}
function nutritionAverages(days){
  const dates = nutritionDatesInWindow(days);
  if (!dates.length) return null;
  const avg = {};
  NUTRIENTS.forEach(n => { avg[n.key] = dates.reduce((s,dt)=>s+dayNutrient(dt,n.key),0) / dates.length; });
  avg._count = dates.length;
  return avg;
}

function foodEntryLine(f){
  const macro = `${fmt(num(f.calories),0)} kcal · P${fmt(num(f.protein),0)} C${fmt(num(f.carbs),0)} F${fmt(num(f.fat),0)}`;
  const amt = f.amountG!=null ? `${fmt(f.amountG,0)} g` : (f.basis==="meal" ? "whole meal" : "");
  return `<div class="list-item">
    <div class="li-ic">${f.basis==="meal"?"🍱":(f.barcode?"🥫":"🍎")}</div>
    <div class="li-main"><div class="li-title">${esc(f.name||"Food")}</div>
      <div class="li-sub">${amt?esc(amt)+" · ":""}${macro}</div></div>
    <div class="li-actions">
      <button class="iconbtn" onclick="openFoodItemSheet('${f.id}')">✎</button>
      <button class="iconbtn" onclick="deleteFoodEntry('${f.id}')">🗑️</button>
    </div>
  </div>`;
}

SCREENS.nutrition = {
  title: "Nutrition",
  render(){
    const d = screenDate("nutrition");
    const log = getNutrition(d);
    const tg = effectiveTargets();
    const avg = nutritionAverages(7);
    const drinkKcal = drinkSugarKcal(d);
    const foodKcal = foodKcalFor(d);
    const burned = getBurned(d);
    const foods = foodLogsForDate(d);
    const hasAny = dayHasNutrition(d);

    const rows = NUTRIENTS.map(n => {
      const val = dayNutrient(d, n.key);
      const has = hasAny;
      const target = num(tg[n.key]);
      const pct = target ? clamp(val/target*100,0,100) : 0;
      let cls = "neutral", barCol = "var(--accent)";
      if (has && target){
        if (n.limit){ cls = val>target ? "bad" : "good"; barCol = val>target?"var(--bad)":"var(--good)"; }
        else { cls = val>=target ? "good" : "warn"; barCol = val>=target?"var(--good)":"var(--warn)"; }
      }
      const bits = [];
      if (n.key==="calories" && foodKcal>0) bits.push(`${fmt(foodKcal,0)} from food`);
      if (n.key==="calories" && drinkKcal>0) bits.push(`${fmt(drinkKcal,0)} from drink sugar`);
      let sub = bits.length ? `<div class="muted" style="font-size:12px;margin-top:3px;">incl. ${bits.join(" · ")}</div>` : "";
      if (n.key==="protein" && proteinIsDerived())
        sub += `<div class="muted" style="font-size:12px;margin-top:3px;">target = ${fmt(STATE.settings.proteinPerKg,1)} g per kg of ${fmt(latestBodyWeightKg(),1)} kg</div>`;
      return `<div style="margin-bottom:13px;">
        <div class="row spread" style="margin-bottom:5px;">
          <span style="font-weight:600;">${n.lab}</span>
          <span style="font-variant-numeric:tabular-nums;">${fmt(val, n.key==="calories"?0:1)}${target?` <span class="muted">/ ${fmt(target,0)} ${n.unit}</span>`:` ${n.unit}`}
            ${has&&target?`<span class="pill ${cls}" style="margin-left:6px;">${n.limit?(val>target?"Over":"OK"):(val>=target?"Met":"Under")}</span>`:""}</span>
        </div>
        <div class="bar"><i style="width:${pct}%;background:${barCol};"></i></div>
        ${sub}
      </div>`;
    }).join("");

    return `
      ${dateBar("nutrition")}
      <div class="card">
        <h3>${d===todayISO()?"Today’s":"Daily"} totals</h3>
        ${hasAny ? rows : `<div class="empty"><span class="big">🍽️</span>Nothing logged for this day yet.</div>`}
      </div>

      <div class="card">
        <div class="row spread" style="align-items:flex-start;">
          <div>
            <div class="eyebrow">Energy burnt</div>
            <div class="stat-big" style="margin-top:5px;color:var(--caffeine);">${burned?fmt(burned,0):"–"}<span class="m-unit" style="font-size:.8rem;"> kcal</span></div>
          </div>
          <div style="text-align:right;">
            <div class="eyebrow">Net</div>
            <div class="stat-big" style="margin-top:5px;">${hasAny||burned?fmt(netCaloriesFor(d),0):"–"}<span class="m-unit" style="font-size:.8rem;"> kcal</span></div>
          </div>
        </div>
        <p class="hint" style="margin:9px 0 10px;">Copy the active energy total from your Apple Watch. Net is what you've eaten minus what you've burnt.</p>
        <div class="row" style="gap:8px;">
          <input class="input" id="burnKcal" type="number" inputmode="numeric" min="0" step="1"
                 value="${hasBurned(d)?esc(getBurned(d)):""}" placeholder="e.g. 620" style="flex:1;">
          <button class="btn primary" onclick="saveBurned()">Save</button>
          ${hasBurned(d)?`<button class="iconbtn" onclick="clearBurned()">🗑️</button>`:""}
        </div>
      </div>

      <div class="card flush">
        <div class="row spread" style="padding:14px 16px 6px"><h3 style="margin:0">Foods</h3>
          <span class="muted">${foods.length} item${foods.length===1?"":"s"}</span></div>
        ${foods.length ? foods.map(foodEntryLine).join("") : `<div style="padding:0 16px 10px" class="hint">No individual foods logged. Scan a barcode or add one below.</div>`}
        <div class="row wrap" style="gap:8px;padding:12px 16px 16px;">
          <button class="btn sm primary" onclick="dayScan()">📷 Scan barcode</button>
          <button class="btn sm" onclick="daySearchFood()">🔎 Search by name</button>
          <button class="btn sm ghost" onclick="dayAddFood()">＋ Add by hand</button>
          <button class="btn sm ghost" onclick="openLogMealSheet()">🍱 Log meal</button>
        </div>
      </div>

      <div class="card">
        <div class="row spread"><h3 style="margin:0">Manual daily total</h3>
          <button class="btn sm ghost" onclick="openNutritionSheet()">${log?"Edit":"Add"}</button></div>
        <p class="hint" style="margin-top:6px;">Optional catch-all if you already know the day's totals from a label or another app — added on top of any foods above.${log?` Currently ${fmt(num(log.calories),0)} kcal.`:""}</p>
      </div>

      <h3 class="section-h">7-day averages</h3>
      <div class="card">
        ${avg ? NUTRIENTS.map(n=>`
          <div class="kv"><span class="k">${n.lab}</span><span class="v">${fmt(avg[n.key], n.key==="calories"?0:1)} ${n.unit}</span></div>`).join("")
          + `<p class="hint" style="margin-top:8px;">Across ${avg._count} logged day${avg._count===1?"":"s"} in the last 7.</p>`
          : `<div class="no-data">No data in the last 7 days.</div>`}
      </div>
    `;
  }
};

/* =====================================================================
   SECTION 4 — BODY COMPOSITION  (one entry per day, 13 metrics)
   ===================================================================== */
const BODY_METRICS = [
  { key:"weight",          lab:"Weight",          unit:"kg",   dp:1, better:"down" },
  { key:"bmi",             lab:"BMI",             unit:"",     dp:1, better:"down" },
  { key:"bodyFat",         lab:"Body fat",        unit:"%",    dp:1, better:"down" },

function bodyLogsSorted(){ return STATE.bodyCompositionLogs.slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0); }
function latestBody(){ const s=bodyLogsSorted(); return s[s.length-1]||null; }
function bodyOnOrBefore(dateISO){ const s=bodyLogsSorted().filter(l=>l.date<=dateISO); return s[s.length-1]||null; }

/* returns delta vs previous entry, ~7d and ~30d ago */
function bodyChange(key){
  const s = bodyLogsSorted().filter(l => l[key]!=null && l[key]!=="");
  if (s.length < 1) return null;
  const latest = s[s.length-1];
  const prev = s.length>=2 ? s[s.length-2] : null;
  const ref = (back) => { const target = addDays(latest.date, -back);
    const c = s.filter(l=>l.date<=target); return c.length?c[c.length-1]:null; };
  const w7 = ref(7), w30 = ref(30);
  const dv = (o) => (o && o!==latest) ? num(latest[key])-num(o[key]) : null;
  return { latest:num(latest[key]), prev:dv(prev), w7:dv(w7), w30:dv(w30) };
}
function changeMarkup(delta, dp, better){
  if (delta==null || Math.abs(delta) < (dp?Math.pow(10,-dp)/2:0.5)) return `<span class="m-chg flat">– no change</span>`;
  const up = delta>0;
  const inv = better==="down" ? "inv" : "";
  return `<span class="m-chg ${up?"up":"down"} ${inv}">${up?"▲":"▼"} ${fmt(Math.abs(delta),dp)}</span>`;
}

function getBrushing(date, slot){ return STATE.brushingLogs.find(l => l.date===date && l.slot===slot) || null; }

function brushStreak(){
  // consecutive days (ending today, or yesterday if today incomplete) with BOTH brushes done
  const bothDone = (d) => { const m=getBrushing(d,"morning"), e=getBrushing(d,"evening"); return m&&m.done&&e&&e.done; };
  let day = todayISO();
  if (!bothDone(day)) day = addDays(day,-1);
  let streak = 0;
  while (bothDone(day)){ streak++; day = addDays(day,-1); }
  return streak;
}
function brushStats(){
  const durations = STATE.brushingLogs.filter(l=>l.done && l.durationSec>0).map(l=>l.durationSec);
  const avgDur = durations.length ? durations.reduce((a,b)=>a+b,0)/durations.length : 0;
  const dates = [...new Set(STATE.brushingLogs.map(l=>l.date))];
  const bothDays = dates.filter(d => { const m=getBrushing(d,"morning"),e=getBrushing(d,"evening"); return m&&m.done&&e&&e.done; }).length;
  return { streak:brushStreak(), avgDur, bothDays, totalDays:dates.length };
}

   ===================================================================== */
let TREND_CAT   = "workouts";
let TREND_RANGE = 30;          // 7 | 30 | 90 | "all"

function allDataDates(){
  const ds = [];
  STATE.workoutLogs.forEach(l=>ds.push(l.date));
  STATE.hydrationLogs.forEach(l=>ds.push(l.date));
  STATE.nutritionLogs.forEach(l=>ds.push(l.date));
  STATE.bodyCompositionLogs.forEach(l=>ds.push(l.date));
  STATE.brushingLogs.forEach(l=>ds.push(l.date));
  STATE.foodLogs.forEach(l=>ds.push(l.date));
  STATE.groomingLogs.forEach(l=>ds.push(l.date));
  return ds.sort();
}
function rangeDates(){
  let start;
  if (TREND_RANGE === "all"){
    const ds = allDataDates();
    start = ds.length ? ds[0] : addDays(todayISO(), -29);
  } else {
    start = addDays(todayISO(), -(TREND_RANGE-1));
  }
  const out = []; let d = start;
  let guard = 0;
  while (d <= todayISO() && guard < 1500){ out.push(d); d = addDays(d,1); guard++; }
  return out;
}
function mondayOf(iso){ const d=fromISO(iso); const wd=(d.getDay()+6)%7; return addDays(iso,-wd); }
function weekBuckets(dates){
  const map = new Map();
  dates.forEach(d=>{ const k=mondayOf(d); if(!map.has(k)) map.set(k,[]); map.get(k).push(d); });
  return [...map.keys()].sort();
}
function shortDate(iso){ const [y,m,d]=iso.split("-"); return `${+d}/${+m}`; }

/* ---- core SVG chart renderer ---- */
function buildChart(title, sub, dates, series, opts={}){
  const W=600, H=250, padL=46, padR=14, padT=12, padB=34;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  let vals=[];
  series.forEach(s=>s.values.forEach(v=>{ if(v!=null && isFinite(v)) vals.push(v); }));
  if (opts.ref!=null) vals.push(opts.ref.value);
  if (!vals.length){
    return `<div class="card chart-card"><div class="chart-title">${esc(title)}</div>${sub?`<div class="chart-sub">${esc(sub)}</div>`:""}<div class="no-data">No data in this range.</div></div>`;
  }
  let minV=Math.min(...vals), maxV=Math.max(...vals);
  if (minV>0) minV=0;
  if (maxV===minV) maxV=minV+1;
  maxV = maxV + (maxV-minV)*0.10;
  const n=dates.length;
  const xFor = i => padL + (n<=1 ? plotW/2 : (i/(n-1))*plotW);
  const yFor = v => padT + plotH - ((v-minV)/(maxV-minV))*plotH;

  // gridlines + y labels
  let grid="", STEPS=4;
  for (let g=0; g<=STEPS; g++){
    const v = minV + (maxV-minV)*(g/STEPS);
    const y = yFor(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--text-faint)">${fmt(v, opts.integer?0:(maxV<10?1:0))}</text>`;
  }
  // x labels (~5)
  let xlab="";
  const labCount = Math.min(5, n);
  for (let i=0;i<labCount;i++){
    const idx = labCount===1?0:Math.round(i*(n-1)/(labCount-1));
    xlab += `<text x="${xFor(idx).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--text-faint)">${shortDate(dates[idx])}</text>`;
  }
  // ref line
  let refSvg="";
  if (opts.ref!=null){
    const y=yFor(opts.ref.value);
    refSvg = `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="${opts.ref.color||"var(--text-faint)"}" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${W-padR}" y="${(y-5).toFixed(1)}" text-anchor="end" font-size="10" fill="${opts.ref.color||"var(--text-faint)"}">${esc(opts.ref.label||"")}</text>`;
  }
  // series
  let body="";
  series.forEach(s=>{
    if (s.type==="bar"){
      const band = plotW/n, bw = Math.max(2, band*0.62);
      s.values.forEach((v,i)=>{
        if (v==null||!isFinite(v)||v===0) return;
        const x = padL + band*i + (band-bw)/2;
        const y = yFor(v), h = yFor(minV)-y;
        body += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="2" fill="${s.color}"/>`;
      });
    } else {
      // line, breaking on null
      let dpath="", started=false, pts="";
      s.values.forEach((v,i)=>{
        if (v==null||!isFinite(v)){ started=false; return; }
        const x=xFor(i), y=yFor(v);
        dpath += (started?` L`:` M`)+` ${x.toFixed(1)} ${y.toFixed(1)}`;
        started=true;
        if (n<=45) pts += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${s.color}"/>`;
      });
      body += `<path d="${dpath.trim()}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${pts}`;
    }
  });
  const legend = series.length>1 || series[0].name
    ? `<div class="chart-legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name||title)}</span>`).join("")}${opts.ref!=null?`<span><i style="background:${opts.ref.color||"var(--text-faint)"}"></i>${esc(opts.ref.label||"target")}</span>`:""}</div>`
    : "";

  return `<div class="card chart-card">
    <div class="chart-title">${esc(title)}</div>
    ${sub?`<div class="chart-sub">${esc(sub)}</div>`:""}
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">
      ${grid}${refSvg}${body}${xlab}
    </svg></div>
    ${legend}
  </div>`;
}
